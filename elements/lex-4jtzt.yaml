evokes: [speed-is-the-default-slowness-needs-a-named-justification, kautilya-rate-of-march, vague-caution-cannot-survive-having-to-be-named, six-conditions-that-license-a-deliberate-slowdown]
lineage:
  - source: primary
    text: kautilya-arthashastra-rate-of-march-default-to-speed
    citation: "Kautilya, The Arthashastra, ed./trans. L.N. Rangarajan (Penguin Books, 1992), Part XI 'Defence and War,' section 'Base Camp to Battle Ground,' 'Rate of March,' {10.2.12,13}."
    quote: "'In the absence of any such reason, the march shall be speeded up.'"
canonical-instances:
  - "A product team preparing to ship a finished feature requires anyone proposing to delay the launch to name a specific, concrete thing the delay would fix (a known bug, a pending legal review, a partner integration not yet ready) rather than accepting 'let's make sure it's really ready' as a standalone reason, since that vague standard could justify delaying indefinitely."
  - "A hiring manager moving to make an offer to a strong candidate requires anyone suggesting to wait for more candidates to name the specific gap in the current pool that waiting would fill, rather than accepting general caution as sufficient justification for slowing down a process where delay itself has a real cost (the candidate taking another offer)."
critical-questions:
  - "does requiring named justifications for delay risk excluding real, legitimate caution that's hard to articulate precisely -- some genuine risks are diffuse or intuitive rather than nameable as one of a fixed list of conditions, and this framework has no room for them?"
  - "who decides whether a proposed reason for delay actually qualifies as one of the named conditions, and can that judgment itself be captured by whoever benefits from moving fast, systematically underweighting real but hard-to-prove risks?"
  - "does a fixed list of licensed delay-conditions become outdated or incomplete as circumstances change, leaving genuinely new reasons to slow down without a category to fit into, and defaulting to speed by omission rather than by genuine absence of risk?"
status: active
