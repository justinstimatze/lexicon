id: lex-bka9g
name: a-value-is-only-basic-if-no-circumstance-would-revise-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before treating a value judgment as beyond factual dispute, test it against a made-up circumstance rather than taking the person's word that it's foundational. Sen: “A value judgment can be called 'basic' to a person if the judgment is supposed to apply under all conceivable circumstances, and it is 'non-basic' otherwise. ... For example, a person may express the judgment, 'A rise in national income measured both at base and final year prices indicates a better economic situation.' We may ask him whether he will stick to this judgment under all factual circumstances and go on, enquiring, 'Would you say the same if the circumstances were such and such (e.g., if the poor were much poorer)?' ... If it turns out that he will revise the judgment under certain circumstances, then the judgment can be taken to be non-basic in his value system. If, on the other hand, there is no situation when a certain person will, say, regard killing a human being to be justifiable, then 'I should not kill a human being' is a basic value judgment in his system.” The test doesn't require the hypothetical to be realistic -- a person defending 'people should dress as they like' who'd drop the position if miniskirts caused cancer has revealed the judgment rests on an empirical belief about consequences, however far-fetched the test case. Diagnostic move: when a value judgment is presented as non-negotiable, invent an extreme or unlikely circumstance and ask whether the person would still hold it there. A single circumstance where they'd revise settles that the judgment is non-basic and opens it to ordinary factual argument -- you're no longer disputing values, you're disputing whatever fact the judgment turned out to be resting on."
