id: lex-u96jb
name: a-founding-shock-outlives-the-argument-against-it
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "A single sharp historical experience can crystallize into a durable public disposition that persists for decades and constrains political choice long after the original event has faded from memory -- and that disposition can keep binding even against a later argument that is, on its own rational merits, stronger. Popper's third thesis: 'since the time of the Boer War, none of the democratic governments of the free world has been in a position to wage a war of aggression. No democratic government would be united upon the issue, because they would not have the nation united behind them. Aggressive war has become almost a moral impossibility.' He then tests the claim against its hardest case: 'the public attitude towards the issue of preventive war against Russia. You may remember that, around 1950, even Bertrand Russell advocated a preventive war. And it must be admitted that there were strong reasons in favour of it. Russia was not yet in possession of an atomic arsenal; and it was the last opportunity of preventing Russia from acquiring the hydrogen bomb. I do not envy the American President his power to decide between such terrible alternatives. The one alternative was to begin a war. The other was to allow Stalin to acquire the power to destroy the world; a power with which he certainly ought not to have been entrusted. Bertrand Russell was no doubt right in maintaining that from a purely rational point of view the second alternative was even worse than the first. But the decision went the other way. An aggressive war, even in these crucial circumstances, and with the then practical certainty of victory, had become morally impossible.' Russell's case was, on Popper's own concession, the rationally stronger one, and it still lost -- because the thing it was up against wasn't a competing argument on the merits, it was a structural fact about what a democratic public could be mobilized to support. Diagnostic move: when a decision seems locked in against what looks like the better argument, check whether the actual obstacle is a rival argument at all, or a disposition laid down by an earlier formative event that no longer needs re-litigating to keep exerting its force."
