lineage:
  - source: primary
    text: fox-1957-engineering-versus-medicine-principles
    citation: "Renée C. Fox, \"Training for Uncertainty,\" in Merton, Reader, and Kendall, eds., The Student-Physician (Cambridge: Harvard University Press for The Commonwealth Fund, 1957), p.223-224."
    quote: "'In engineering, once you really understand a principle, it stays with you, and you feel confident you will be able to use it in attacking a wide range of new problems. If you really understand mechanics, you can do anything with it, and you don't have to worry so much about whether certain things are true in one case and not in another.... The problems may be new tomorrow, but the basic principles don't change (much).... With medicine, it's different.... There are as many exceptions as there are rules... and the important things in one case don't count in another.... You can't read the chapter and \"figure out the problem\" in medicine. And it is the greatest folly to argue with an instructor (a good one) with only the chapter behind you. You can say, \"Cecil says...\" but if he's seen patients with such-and-such for twenty years, then he probably has you. In other words, years of experience don't modify the principles of the engineering book, but in medicine they do....'"
canonical-instances:
  - "In contract law, a settled statutory rule usually resolves a new fact pattern directly, and citing the statute settles most disputes; in employment litigation involving 'reasonableness' standards, a lawyer who has tried two hundred similar cases can often override a first-year associate's correct citation of the black-letter rule, because the rule's application turns on exception-laden context the citation alone can't capture."
  - "In classical mechanics homework, mastering F=ma solves a huge range of new problems directly; in clinical nutrition, a dietitian's textbook macro targets are routinely overridden by a specific patient's fifteen years of comorbidities and medication interactions that no general guideline anticipated — the guideline is a starting point, not an answer."
critical-questions:
  - "Is 'exception density' itself a stable property of a field, or does it shift as a field matures — does a young field start idiographic (dominated by case experience) and become more nomothetic (principle-governed) as its accumulated cases get codified into better rules, the way parts of medicine itself have moved in that direction over a century?"
  - "Can a novice tell in advance which kind of domain they're entering, or is exception-density itself something you only learn by first over-trusting a principle and getting overridden by an exception, the way the student in this quote appears to have learned it?"
