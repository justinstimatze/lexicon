id: lex-f6rqu
name: strip-domain-jargon-from-a-stuck-problem-before-working-it
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a problem has stalled inside a specialty, restate it in the plainest possible generic terms before trying to solve it again — the specialized vocabulary itself is what's anchoring the search to the specialty's own accepted methods, and stripping it can unlock solutions the jargon-laden version never suggested. Altshuller reports a controlled demonstration of this exact effect. Nineteen students given a problem about measuring a weevil's body temperature (phrased with the technical term 'weevil') solved it at a low rate: 'The correct answers were given by five.' A second, matched group received the identical problem with one addition: 'If you replace the word weevil by several simple words, the problem will become easier.' Same problem, same time limit, only the framing changed: 'As a result there were 17 correct answers in the same amount of time.' Altshuller explains the mechanism directly: 'The terms are created in order to limit the known as reliably and firmly as possible. Any invention, however, constitutes an exit beyond the limits of the known.' A specialized noun doesn't just name a thing — it imports an entire cluster of assumed methods and equipment associated with that category, and those assumed methods are exactly what's failing. His own example generalizes the fix: 'if we substitute for the word weevil even the words something very small (a bug, a grain of sand, a drop) then the problem will be drastically simplified. Can it really be difficult to learn the temperature of a single droplet if it is raining and one can gather a glassful of rainwater?' Reframed as 'a very small object,' the solver's mind is no longer restricted to entomological instruments and can reach for an analogous small-scale measurement from any field. Altshuller builds this into his method as a mandatory first step, precisely because it's easy to skip: 'the specifications of the problem are laid out without using specialized terminology. This simple operation significantly reduces the primary charge of psychological inertia.' Diagnostic move: when a problem stated in a specialist's vocabulary has stalled, rewrite it using only generic, category-neutral words for every named object, material, or process — replace the technical noun with 'a thing that does X' or 'something very small/large/fast' — before making another attempt; the jargon's disappearance often reveals that the problem is structurally identical to one already solved in a completely different field."
related: [lex-4pb6j, lex-75nw3]
evokes: [weevil-thermometer-experiment, de-jargon-the-problem-statement, terminology-limits-the-known, psychological-inertia-from-vocabulary]
lineage:
  - source: primary
    text: altshuller-1984-weevil-experiment
    citation: "G. S. Altshuller, Creativity as an Exact Science: The Theory of the Solution of Inventive Problems, trans. Anthony Williams (Gordon and Breach, 1984), Ch.3 'Tactics of Invention: Managing the Process of Task Solving,' section 'The Programme + Information + Management by Psychological Factors.'"
    quote: "'At the Seed Institute Academician Lisitsyn on one occasion told the inventor Kachugin, that it was intended to hold a conference on one of the most important problems, the fight against the weevil. It was to study the conditions of life of the beetle, and in particular to determine its body temperature... Experiments had also been performed on this problem. Nineteen eighth-grade high school students were working (each one independently) on this problem for half an hour. The correct answers were given by five. Another group received the same text of the problem, but with the note: If you replace the word weevil by several simple words, the problem will become easier. As a result there were 17 correct answers in the same amount of time.'"
  - source: primary
    text: altshuller-1984-terminology-limits-the-known
    citation: "Altshuller, Creativity as an Exact Science (1984), Ch.3, 'The Programme + Information + Management by Psychological Factors.'"
    quote: "'At Step 2.1 the specifications of the problem are laid out without using specialized terminology. This simple operation significantly reduces the primary charge of psychological inertia. The terms are created in order to limit the known as reliably and firmly as possible. Any invention, however, constitutes an exit beyond the limits of the known... Indeed, if we substitute for the word weevil even the words something very small (a bug, a grain of sand, a drop) then the problem will be drastically simplified. Can it really be difficult to learn the temperature of a single droplet if it is raining and one can gather a glassful of rainwater?'"
canonical-instances:
  - "A team stuck on 'how do we reduce database query latency' rewrites the problem as 'how do we reduce the time between asking a question and getting the answer, when both the asking and the answering happen repeatedly' — stripped of 'database' and 'query,' the reframing opens comparison to caching strategies from completely unrelated fields (a restaurant pre-cooking popular dishes, a library keeping frequently-requested books at the front desk) that the jargon-laden version never suggested."
  - "A hospital administrator stuck on 'how do we shorten emergency-room wait times' restates it as 'how do we get people who need attention seen faster when demand for attention is unpredictable and capacity is fixed' — dropping 'emergency room' opens comparison to queueing solutions from call centers and amusement-park ride lines, which don't share any medical vocabulary but share the exact structural problem."
  - "operationally distinct from lex-4pb6j broadcast-a-stuck-problem-outside-its-native-field-to-reach-its-solver: that atom widens WHO encounters the problem statement, keeping the statement itself unchanged; this atom changes the STATEMENT ITSELF (stripping jargon) so that the SAME solver, without consulting anyone new, is freed from the vocabulary-imposed assumptions that were blocking their own search."
critical-questions:
  - "does stripping jargon risk losing genuinely load-bearing technical precision — could 'something very small' cause a solver to miss a constraint that only the specific term 'weevil' (or 'database query') actually encodes, producing a solution that doesn't fit the real problem?"
  - "is the weevil result (5 correct out of 19 vs. 17 out of 19) likely to generalize to problems where the jargon is doing less purely-restrictive work and more genuinely load-bearing conceptual work — does the effect size shrink or vanish once the specialized term is actually necessary rather than merely traditional?"
  - "who is best positioned to notice that a problem's jargon is limiting the search — the specialist embedded in the terminology, who may not perceive it as jargon at all, or an outsider, who may not know enough about the problem to correctly identify which terms are load-bearing and which are arbitrary category labels?"
