id: lex-vt4kd
name: ranking-the-stakes-against-each-other-exposes-a-disproportionate-fight
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "A dispute that has escalated past its original terms rarely gets defused by arguing the merits of the original claim — both sides are now committed to a fight, not a resource. Naming what's actually being staked, in order, and making each side say the value out loud, can expose a disproportion neither side had stated: they're risking something priceless to win something nearly worthless. In the Jataka's tale of Kunala, two kingdoms are moments from war over irrigation water when the Buddha asks a plain sequence of questions instead of arbitrating the dispute: \"What is the water worth?\" \"Very little, Holy Sir.\" \"What is the earth worth?\" \"It is of priceless value.\" \"What are warrior chiefs worth?\" \"They too are of priceless value.\" \"Why on account of some worthless water are you for destroying chiefs of high worth?\" Neither side had weighed the trade before being asked to say it aloud."
related: []
evokes: [jataka, asitinipata, kunala-jataka, proportionality-reframe, de-escalation]
lineage:
  - source: primary
    text: jataka-francis1905-kunala-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. V, trans. H. T. Francis, ed. E. B. Cowell (Cambridge University Press, 1905), Book XXI (Asitinipata), No. 536, Kunala-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "\"What is the water worth?\" \"Very little, Holy Sir.\" \"What is the earth worth?\" \"It is of priceless value.\" \"What are warrior chiefs worth?\" \"They too are of priceless value.\" \"Why on account of some worthless water are you for destroying chiefs of high worth?\""
canonical-instances:
  - "Two departments are about to escalate a budget dispute over a $10,000 line item to the board — a mediator asks each side what a board fight costs in reputation and goodwill compared to the line item itself, and both sides quietly agree to split the difference before the meeting."
  - "A divorcing couple is fighting over who keeps a specific piece of furniture, running up thousands in legal fees — their lawyer asks each of them, separately, what the furniture is actually worth versus what another month of litigation costs, and the fight ends within the week."
critical-questions:
  - "The question works only because both sides already privately agree on the relative values — priceless chiefs versus worthless water isn't a claim either side disputes once asked. What happens when a proportionality reframe is applied to a dispute where the two sides don't actually agree on what's at stake, or on which side is which?"
  - "Naming the disproportion stopped this particular fight, but the underlying scarcity, not enough water for both harvests, was never actually resolved. Does exposing a disproportionate fight solve the dispute, or does it just defer the real conflict to whenever the next scarce resource forces the same choice again?"
status: active
