    citation: "Lex-0475 and lex-tqa55 ground Kruglanski-Webster's need-for-cognitive-closure construct — the same 'seizing and freezing' phrase Grant borrows in this chapter's 'SECOND THOUGHTS' section to explain why we readily update possessions but not beliefs — the identical underlying psychological construct, not a coincidental phrase collision. This atom remains distinct: Kruglanski's construct describes when a judgment locks in (a trigger condition — time pressure, cognitive load, need for closure) and is agnostic to the content or style of the locked-in stance. Grant's four-mode framework is orthogonal: it names which relational stance (preacher/prosecutor/politician/scientist) an agent adopts toward a belief once challenged, independent of whether high need-for-closure caused the challenge-response to fire in the first place. The two are compositional (high need-for-closure raises the odds of landing in a defensive mode) rather than redundant (need-for-closure doesn't specify which of the three defensive modes, nor name the productive fourth). Lex-0133 (confirmation-bias), lex-rcj6y (motivated-reasoning), lex-vacbr (identity-protective-cognition), lex-2rsad (identity-protective-belief-maintenance), and lex-jw34x (dissonance-driven-identity-defense) each name a mechanism by which a challenged belief resists updating (selective evidence-weighting, identity-fusion, escalating self-justification); none names the four-way relational-stance typology that is Grant's specific contribution here. Grant's own text treats confirmation bias and desirability bias as downstream consequences that prosecutor/politician mode 'launches us into,' confirming the mechanism/stance distinction rather than a naming overlap."
canonical-instances:
  - "The Greenspan/Madoff decision as an instance of all three defensive modes converging on a single bad decision at once: Stephen Greenspan's sister was 'preaching about the merits of the fund'; her confidence 'led Greenspan to prosecute the friend who warned him against investing, deeming the friend guilty of \"knee-jerk cynicism\"'; and Greenspan himself was 'in politician mode when he let his desire for approval sway him toward a yes.' Grant's counterfactual names the missing fourth mode directly: had Greenspan 'analyzed the fund's strategy more systematically instead of simply trusting in the results,' 'sought out more perspectives from credible sources,' and 'experimented with investing smaller amounts over a longer period of time' — 'that would have put him in the mode of a scientist.'"
  - "Mike Lazaridis and the collapse of BlackBerry: the keyboard 'was a BlackBerry virtue he loved to preach—and an Apple vice he was quick to prosecute'; as the company's stock fell he 'got caught up in confirmation bias and desirability bias, and fell victim to validation from fans'; and 'like a politician who campaigns only to his base, he focused on the keyboard taste of millions of existing users, neglecting the appeal of a touchscreen to billions of potential users.' A gifted engineer, trapped in an overconfidence cycle about his own invention rather than scientist mode."
  - "The Italian-startup field experiment: founders randomly assigned to a 'scientific thinking' framing (strategy as theory, customer interviews as hypothesis generation, prototypes as experiments) averaged over $12,000 in first-year revenue and pivoted more than twice as often when their hypotheses weren't supported, against under $300 in revenue for a control group given identical training minus the scientist-mode reframing — direct evidence that the fourth mode has a measurable practical payoff over the three defensive defaults."
  - "The eraser-marks study and first-instinct fallacy: 'About three quarters of students are convinced that revising their answer will hurt their score,' yet across thirty-three reviewed studies 'the majority of answer revisions were from wrong to right,' and counting actual eraser marks on 1,500+ exams found 'half were from wrong to right' against only a quarter wrong. Evidence that the pull toward freezing a first judgment operates even in the lowest-stakes case of a single test answer, where updating is nearly costless."
  - "The 2021 Good Judgment Project forecasting tournament: thousands of forecasters were surveyed on 'their tendencies to think like preachers, prosecutors, politicians, and scientists' before making over twenty thousand forecasts; 'the ones who thought like scientists updated their forecasts more often and achieved higher accuracy' — direct empirical linkage between self-reported scientist-mode tendency and real-world predictive performance."
critical-questions:
  - "When this belief was challenged, did the response take the form of a sermon protecting a sacred value (preacher), an attack aimed at proving the challenger wrong (prosecutor), a bid for audience approval (politician), or a hypothesis being tested against new evidence (scientist)?"
  - "What would changing this view MEAN to the person holding it — a mark of moral weakness, an admission of defeat, a flip-flop in response to carrots and sticks, or a sign of intellectual integrity and a step toward the truth? The answer identifies the mode more reliably than the content of the belief itself."
  - "Is the search, if any is happening, aimed at reasons the current view must be right, or reasons it might be wrong? Reacting with an open mind is not the same as actively searching for disconfirming reasons."
  - "Would revising this view cost the person something beyond simply being wrong — status with a constituency, victory in an ongoing argument, standing in a moral community they belong to? That cost, not the balance of evidence, may be what's driving the mode."
  - "Is 'being open-minded' being treated as a fixed personality trait the person already has, rather than a situational practice that has to be re-chosen every time a specific belief is challenged? Even trained scientists default to preacher, prosecutor, or politician mode about their own pet theories."
