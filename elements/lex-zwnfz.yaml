lineage:
  - source: primary
    text: lakoff-johnson-1980-metaphors-we-live-by
    citation: "George Lakoff and Mark Johnson, *Metaphors We Live By* (University of Chicago Press 1980; afterword 2003 reissue), Chapter 4 'Orientational Metaphors'. The transferable claim is that one class of conceptual metaphors — orientational metaphors — is non-arbitrarily grounded in bodily-spatial experience. Lakoff & Johnson document dozens of UP-DOWN spatializations (HAPPY-IS-UP, GOOD-IS-UP, HEALTH-IS-UP, ALIVE-IS-UP, CONTROL-IS-UP, MORE-IS-UP, RATIONAL-IS-UP, STATUS-IS-UP, VIRTUE-IS-UP, KNOWN-IS-DOWN/UNKNOWN-IS-UP) with their bodily bases (drooping = sad, erect = positive; adding to pile = up; physical-domination = upright; etc.). They argue that the SPECIFIC choice of bodily basis from among the many possible ones is culturally constrained by overall metaphor-system coherence (HAPPY-IS-UP coheres with GOOD-IS-UP, HEALTH-IS-UP, etc. — that's why HAPPY-IS-UP wins over HAPPY-IS-WIDE which has equally valid bodily basis). Distinct from the broader claim of lex-kfdep that conceptual metaphor IS cognitive infrastructure (the meta-claim). This atom names the specific empirical regularity — that orientational metaphors track bodily-spatial experience — and its practitioner consequences. The image-schema literature (Johnson 1987 *The Body in the Mind*; Talmy 1983 *How Language Structures Space*; Lakoff 1987 *Women, Fire, and Dangerous Things*; Mandler 2004 *The Foundations of Mind*) extends this empirical regularity into a developmental and cognitive-architecture account. Cross-cultural studies (Núñez & Sweetser 2006 on Aymara future-behind; Boroditsky 2001 on Mandarin vertical time) document the cross-cultural variation that the bodily-grounding mechanism predicts."
    quote: "[Lakoff & Johnson 1980 Ch.4, opening:] 'But there is another kind of metaphorical concept, one that does not structure one concept in terms of another but instead organizes a whole system of concepts with respect to one another. We will call these orientational metaphors, since most of them have to do with spatial orientation: up-down, in-out, front-back, on-off, deep-shallow, central-peripheral. These spatial orientations arise from the fact that we have bodies of the sort we have and that they function as they do in our physical environment.' [Same chapter on the canonical case:] 'HAPPY IS UP; SAD IS DOWN... Physical basis: Drooping posture typically goes along with sadness and depression, erect posture with a positive emotional state.' [On MORE-IS-UP:] 'MORE IS UP; LESS IS DOWN... Physical basis: If you add more of a substance or of physical objects to a container or pile, the level goes up.' [On the non-arbitrariness:] 'Such metaphorical orientations are not arbitrary. They have a basis in our physical and cultural experience.' [On coherence-driven choice from among bodily bases:] 'There are many possible physical and social bases for metaphor. Coherence within the overall system seems to be part of the reason why one is chosen and not another.' [On the role for scientific concepts:] 'So-called purely intellectual concepts, e.g., the concepts in a scientific theory, are often—perhaps always—based on metaphors that have a physical and/or cultural basis. The high in \"high-energy particles\" is based on MORE IS UP. The high in \"high-level functions,\" as in physiological psychology, is based on RATIONAL IS UP.'"
canonical-instances:
  - "Progress bars fill LEFT-TO-RIGHT and DOWN-TO-UP in most cultures (English/Western/CJK). The convention isn't arbitrary — it inherits from reading-direction (left-to-right cultures) and MORE-IS-UP (universal bodily). Right-to-left cultures (Arabic, Hebrew) flip the horizontal direction but keep the vertical. The vertical persists across all cultures because the bodily MORE-IS-UP grounding is universal."
  - "Voltage taught as height-of-water-in-a-tank, current as flow-rate-through-pipe, resistance as pipe-narrowness: the abstract electrical domain inherits the bodily-experiential structure of water + plumbing. Students reason about water (which they have bodily experience of) and the electrical structure rides along. The teaching-metaphor isn't a teaching crutch — it's how the abstract concept becomes thinkable at all."
  - "Aymara speakers (Andes, Núñez & Sweetser 2006) speak of the past as IN FRONT (visible, known, can be pointed at) and the future as BEHIND (unseen, unknown). The orientation tracks visibility-of-the-known, not direction-of-motion. Practitioners designing tools for cross-cultural time-reasoning (calendar apps, timeline visualizations) must check that their UP/FORWARD intuitions don't conflict with the user's cultural bodily-grounding."
  - "STATUS-IS-UP grounding: physically dominant individuals in social-mammal hierarchies tower over subordinates; the orientation is bodily-universal across primates. Status conventions in human architecture (raised dais, throne, podium, executive top-floor office, 'higher-ups') inherit the bodily schema. When you can't predict why a layout feels-high-status, check the bodily inheritance."
  - "UNKNOWN-IS-UP / KNOWN-IS-DOWN ('the matter is still up in the air' vs 'the matter is settled'): bodily-grounded in UNDERSTANDING-IS-GRASPING (graspable things sit still on ground; un-graspable things drift in air). This is coherent with UNDERSTANDING-IS-GRASPING but INCOHERENT with FINISHED-IS-UP (which uses a different bodily basis — completion-as-reaching-top). The two metaphors don't compose. Practitioner consequence: when designing language about a process, pick one bodily-schema-family and stick with it; mixing creates 'tying up loose ends' (FINISHED-IS-UP) with 'the matter is up in the air' (UNFINISHED-IS-UP) — readers experience the mix as awkward without being able to name why."
  - "Distinguished from lex-kfdep conceptual-metaphors-structure-cognition: lex-kfdep is the meta-claim (metaphor is cognitive infrastructure). This atom is the specific SUB-MECHANISM by which orientational metaphors are bodily-grounded. Other sub-mechanisms (structural metaphors via cross-domain similarity, ontological metaphors via reification of experience) have different grounding. They compose."
  - "Distinguished from lex-sp7fa highlighting-and-hiding: lex-sp7fa is about the SELECTIVE-ATTENTION property of any framing (every framing makes some aspects salient and others invisible). This atom is about WHERE orientational metaphors' inherited structure comes from (the body). They are orthogonal sub-mechanisms of the lex-kfdep meta-claim."
critical-questions:
  - "Is the bodily grounding UNIVERSAL or CULTURE-SPECIFIC? UP-DOWN, IN-OUT, FRONT-BACK have universal bodily grounding (gravity, body-orientation, motion-direction) — but the SPECIFIC choice of which orientation maps to which abstract concept can vary culturally (Aymara future-behind). Failure mode: assuming UP-IS-GOOD universally; some cultures have UP-IS-DANGEROUS-EXPOSURE."
  - "Have you accounted for incoherent metaphor-system mixing? UNKNOWN-IS-UP coexists in English with FINISHED-IS-UP because they have different bodily bases. Trying to design language that uses both creates the awkwardness Lakoff-Johnson identify. Diagnose: when language feels mixed-up, check whether two orientational metaphors with different bodily bases are competing."
  - "Is the bodily grounding the FULL explanation for the metaphor, or just a NECESSARY-NOT-SUFFICIENT constraint? Lakoff-Johnson argue it's necessary-not-sufficient: the bodily basis enables the metaphor, but coherence within the overall metaphor system determines which bodily basis gets used. HAPPY-IS-UP wins over HAPPY-IS-WIDE because of coherence with GOOD-IS-UP, HEALTH-IS-UP — the bodily basis for HAPPY-IS-WIDE is equally valid but doesn't cohere as well system-wide."
  - "Does the cross-cultural variation undermine the universality claim? No — it operates at the level of which cultural-specific metaphors get selected from the universal bodily-grounding space. The bodily-grounding mechanism is universal; the specific selections vary. Don't read 'cross-cultural variation exists' as 'orientation metaphors are arbitrary cultural conventions'."
  - "How robust is the empirical claim against subsequent critique? Conceptual Metaphor Theory has been contested (some experimental psycholinguists argue the role of orientational metaphors in online comprehension is weaker than CMT predicts; see McGlone 2007 review). The corpus-linguistic evidence for systematic orientational metaphor in language is strong; the cognitive-architecture claim is more contested. Cite the corpus-pattern level confidently; cite the cognitive-architecture level with appropriate caveats."
status: active
