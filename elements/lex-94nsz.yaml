id: lex-94nsz
name: monolithic-category-bundles-multiple-independently-variable-dimensions
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when a category is defended as a single natural type (`sex,` `race,` `sexual orientation,` `class,` `disability,` `mental illness diagnosis,` `intelligence,` `species,` `language,` `creditworthiness`) but careful measurement reveals it is a COLLAPSE of multiple distinct dimensions that can and do vary independently in the population. Fausto-Sterling's canonical case: what gets called `sex` is at least five anatomical/physiological dimensions — sex chromosomes (XX, XY, XO, XXY, mosaics, etc.), gonadal tissue (ovaries, testes, ovotestes, streak gonads), hormones (estrogen/androgen profiles), internal reproductive anatomy (uterus, fallopian tubes, vas deferens, prostate), external genitalia — plus secondary sex characteristics. These five dimensions DO NOT ALWAYS ALIGN. Intersex variation (~1.7% of births by Fausto-Sterling's estimate) demonstrates the independence empirically; the cultural insistence on `male/female` binary is achieved through medical-surgical enforcement on bodies that present otherwise, not through any underlying biological binary. The transferable form: any apparently-monolithic category should be inspected for its underlying dimensionality. Often what looks like one fact is a bundle of N facts, and the bundling is institutional rather than natural. The dimensions can vary independently in the population, and forcing a single-axis classification onto the bundle systematically erases the cases where the dimensions don't align. Transferable applications: race (ancestry + phenotype + culture + self-identification + others' perception — five dimensions); sexual orientation (Kinsey: attraction + behavior + identity — three dimensions); disability (impairment + functional limitation + social barriers + identity — four dimensions); class (income + wealth + occupation + education + cultural capital — five dimensions); language (mutual intelligibility + standard-script + state recognition + speaker identity); intelligence (multiple domains in psychometric literature: verbal, mathematical, spatial, social, kinesthetic, etc. — Gardner-style); species (biological-species concept + morphological + ecological + phylogenetic — multiple definitions diverging on edge cases); creditworthiness (income + asset + payment history + employment stability — bundled into a single FICO score). The atom does NOT claim categories are useless; it claims the SINGLE-AXIS PRESENTATION of a multidimensional bundle hides which dimensions are doing the work in any specific application. Distinct from lex-cgqta naturalization-erases-the-mechanism-that-produced-the-effect (the naturalization claim — about hiding institutional process). Distinct from lex-b9us2 legibility-via-standardization-erases-what-doesnt-fit (about state-imposed simplification for governance). lex-94nsz names the specific structural fact that one-named-category often equals N-independent-dimensions; lex-cgqta explains why the bundling appears natural; lex-b9us2 explains the institutional incentive to maintain the appearance. The three compose; lex-94nsz is the empirical/structural diagnostic. Use when (i) a debate hinges on `is X really Y or not Y` as if X were one-dimensional, (ii) a policy treats a category as monolithic and fails edge cases, (iii) a measurement reduces to a single score what the underlying instrument captures as a vector. Counter-move: name the dimensions the category bundles, ask whether they always align, identify which dimension the specific application actually depends on, route the question to that dimension."
