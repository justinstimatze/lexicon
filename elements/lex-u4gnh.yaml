id: lex-u4gnh
name: support-an-allys-tactic-without-adopting-or-condemning-it
type-in: situation
type-out: posture
_tier: atomic
agent-instruction: "When a fellow traveler in a shared cause adopts a more radical or personally uncongenial tactic than the one you yourself practice, and you are pressed to explain why you did not personally join them, resist the binary of either claiming the tactic as your own or repudiating it as illegitimate for the cause -- hold instead that a cause large enough to need many hands is served by heterogeneous methods suited to different actors' gifts, positions, and temperaments, and take the posture of materially aiding every legitimate method without adopting or publicly denouncing any one of them. Frederick Douglass's 1881 autobiography records this posture with precision in the aftermath of John Brown's raid on Harper's Ferry. Douglass had been Brown's friend and fundraiser for over a decade, hosting him, soliciting money on his behalf, and knowing in general terms of Brown's ultimate design -- yet Douglass did not go to Harper's Ferry, and was publicly accused of cowardice for it. His answer, in an 1859 letter published while he was a fugitive from federal arrest, does two distinct things. First, he refuses to disown the tactic on moral or prudential grounds: 'If any body is disposed to think less of me on account of this sentiment, or because I may have had a knowledge of what was about to occur, and did not assume the base and detestable character of an informer, he is a man whose good or bad opinion of me may be equally repugnant and despicable.' Second, having cleared away any implication that his non-participation was disapproval, he gives the actual reason: 'The tools to those who can use them! Let every man work for the abolition of slavery in his own way. I would help all and hinder none.' The mechanism separates two questions a hostile framing collapses into one: 'is this the right tactic for ME' and 'is this a legitimate tactic for the CAUSE.' Douglass answers the first no (armed insurrection did not suit his instrument -- the pen, the platform, political organizing) and the second yes, and crucially he had already been answering the second yes for years, materially, before Brown ever reached Harper's Ferry -- 'I would help all' is not a retrospective rationalization but a description of his actual fundraising conduct. This differs from mere toleration (permitting a tactic while inwardly disapproving, or staying publicly silent about it): the posture requires active material aid to the tactic one does not personally practice, combined with a refusal to let that non-adoption curdle into public distancing when the tactic goes wrong. Portable beyond abolition: within a social movement, a moderate advocacy wing and a more confrontational direct-action wing can each pursue the same goal by different tactics, with members of one wing declining to personally adopt the other's method while continuing to fund it, share resources with it, and decline to denounce it to outside or hostile audiences; within a company, a leader who built their own career through cautious, incremental execution can back a subordinate's more aggressive, higher-variance strategy for reaching the same target without adopting the strategy personally or hedging their support once it takes on risk. Diagnostic and scope: this posture is not indiscriminate tactical pluralism. It requires, first, a genuinely shared end rather than superficially aligned goals that are actually in tension; second, that the actor declining the more radical tactic have independently examined it and found it legitimate on its own terms -- Douglass did not decline Harper's Ferry because he judged it wrong, he declined it because it was not his instrument, and he says so explicitly. Where an actor privately believes the more radical tactic is actually wrong or counterproductive, 'tools to those who can use them' is not available as a face-saving non-endorsement that avoids the harder work of actually disagreeing; using it that way is a different and dishonest posture this atom does not license."
related: [lex-czseb, lex-7w239, lex-2sr4y, lex-u967f]
