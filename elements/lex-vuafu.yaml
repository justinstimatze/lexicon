lineage:
  - source: primary
    text: tero-et-al-2010-rules-for-biologically-inspired-adaptive-network-design
    citation: "Atsushi Tero, Seiji Takagi, Tetsu Saigusa, Kentaro Ito, Dan P. Bebber, Mark D. Fricker, Kenji Yumiki, Ryo Kobayashi, Toshiyuki Nakagaki, 'Rules for biologically inspired adaptive network design,' Science 327, no. 5964 (2010): 439-442."
    quote: "Overall, we conclude that the Physarum networks showed similar characteristics to those of the rail network in terms of their cost, transport efficiency, and fault tolerance. However, the Physarum networks self-organised without centralized control or explicit global information by a process of selective reinforcement of preferred routes and simultaneous removal of redundant connections. We developed a mathematical model for adaptive network construction to emulate this behaviour based on feedback loops between the thickness of each tube and internal protoplasmic flow [...] in which high rates of streaming stimulate an increase in tube diameter, whereas tubes tend to decline at low flow rates. [...] the conductivity of each tube evolves according to the equation dDij/dt = f(|Qij|) - Dij. The first term on the right hand side describes the expansion of tubes in response to the flux. The second term represents the rate of tube constriction, so that in the absence of flow the tubes will gradually disappear. [...] In general, increasing I0 promoted formation of alternative routes that improved performance by reducing MDMST and made the network more fault tolerant, but with increased cost. [...] decreasing I0 [...] or increasing gamma [...] drove the system towards a low cost minimal spanning tree, but with an inevitable decrease in resilience."
  - source: discovery-loop
    text: tero-2010-mining-pass-
    citation: "Lex-0261 (coupled-oscillators-self-synchronize) cites Dictyostelium (a different slime mold species) cAMP-pulse synchronization as a Kuramoto-sync canonical instance — a phase-locking-oscillators claim, structurally unrelated to network-topology optimization via edge-level flow reinforcement. Lex-0094 (feedback-loop-as-mechanism) names the general feedback-loop family; this atom is a specific, portable instance within that family, distinguished by the emergent global network-topology-optimization claim and the empirical real-infrastructure validation, which lex-spm8x deliberately does not commit to. Lex-0592 (coordinated-aggregate-from-local-perception-rules-with-no-central-control) is a genuine structural cousin — both are 'local rules produce global coordination without a controller' — but lex-c646m's canonical case is Reynolds boids flocking, discrete agents coordinating spatial movement via avoid/match/center rules, while this atom is about network edges accumulating or losing capacity via flow-reinforcement: a different substrate and a different emergent property, topology optimization along a cost/efficiency/fault-tolerance tradeoff rather than spatial cohesion."
canonical-instances:
  - "Tero et al.'s own experiment: Physarum plasmodium grown over food sources placed at Tokyo-area city positions reconstructed a network topologically similar to the actual Tokyo rail system, at ~1.75x the cost of the theoretical minimum-spanning tree (vs. the real rail network's ~1.8x) and comparable transport efficiency, with only modestly lower fault tolerance than the real network."
  - "Ant colony trail networks (a cognate case the paper itself cites): individual ants deposit pheromone on paths they traverse, pheromone evaporates on unused paths, and the colony's aggregate foraging network self-organizes toward efficient, redundant routes to food sources -- same local-reinforce/decay-without-central-control structure, chemical rather than hydrodynamic substrate."
  - "Internet/BGP-style route convergence and, more speculatively, informal organizational communication channels: paths that carry more traffic get invested in (more bandwidth provisioned, more relationship-maintenance effort spent) and paths that go unused atrophy, producing a network shape nobody explicitly designed."
  - "The tunable-tradeoff instance: a startup's ad-hoc internal communication network under a hierarchical, winner-take-all information-routing norm ossifies into a brittle hub-and-spoke tree (cheap, fast, but a single node's absence fragments the group); the same organization under a norm that tolerates redundant, weaker communication channels persisting develops more cross-links, higher coordination cost, and survives any one person being unavailable."
critical-questions:
  - "Isn't this just 'the free market finds efficient allocations,' restated for networks? No -- the mechanism here has no price signal, no agents making comparative judgments, and no competition between alternatives being evaluated against each other; each edge only ever responds to its OWN local flow, with zero information about any other edge's state. The market analogy imports a coordination mechanism (prices aggregating dispersed information, per lex-6pcc4) that this mechanism does not have and does not need -- the aggregate efficiency here is a purely mechanical byproduct of many independent local rules, not of anything resembling comparison or choice."
  - "Doesn't this contradict lex-g9b38 (Ashby's Law of Requisite Variety), since a network with no central regulator somehow still gets regulated toward a good outcome? No -- Ashby's law is about a designated REGULATOR needing enough response-variety to counter a disturbance; this mechanism has no regulator at all. The 'regulation' toward good topology is not being performed by any single component tracking network-level state -- it emerges from the aggregate of purely local responses. The two claims operate at different levels and do not conflict: this atom explains how you can get good aggregate behavior WITHOUT a regulator, which Ashby's law says nothing about since it presupposes one exists."
  - "Is the reinforcement-sharpness parameter (gamma in the paper) something a real-world designer can actually set, or is this only descriptive of biological/emergent systems? Both -- the paper is explicit that the model is intended to 'guide network construction in other domains' (sensor arrays, mesh networks). Where the local rule is implementable in software or protocol design (e.g., route-weight decay/reinforcement in adaptive routing protocols), the sharpness parameter is a literal design lever. Where the network is social/organizational, 'sharpness' maps to a NORM (how aggressively does the group let weaker/redundant channels die out) rather than a numeric dial, but the tradeoff direction is the same."
