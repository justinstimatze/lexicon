id: lex-aj89z
name: change-the-instrument-not-the-fixed-natural-object
type-in: situation
type-out: process
_tier: atomic
agent-instruction: "When a conflict involves both a fixed, given object you can't redesign (a natural material, a person's body, an already-committed external constraint) and a tool or medium you built and fully control, confine your search for a fix to the controllable instrument — attempts to redesign the fixed object are wasted moves that will not lead anywhere, no matter how many of them you try. Altshuller demonstrates this by re-analyzing psychologist K. Dunker's own famous 1926/1935 X-ray tumor experiment, where a subject worked through thirteen numbered attempts to cure a tumor with X-rays strong enough to also damage healthy tissue. Applying one rule in hindsight — 'one may have to change the instrument, but not the artefact (which is a technical and not a natural object)' — Altshuller classifies every single attempt: 'In the problem there are two substances (the tumour and the healthy tissue around it) and one field (the X-rays). Both substances are natural... The rays are the instrument. The first variant is an attempt to do something with the healthy tissues... This is a clear violation of the rule and hence it is a futile variant.' Working through Dunker's transcript step by step, every attempt that targeted the tumor or the healthy tissue turned out to be empty, and every productive step (redirecting, dispersing, or reshaping the ray pattern itself) targeted the instrument: 'Thus 11 of the 'empty' variants would not have appeared if the rule about the artefact and the instrument had been introduced.' Altshuller reports the practical payoff directly: a group given the problem cold took 45 minutes with only one success; the same problem given after the rule was explained up front was 'solved by everyone and over half with their first variant.' Crucially, Altshuller notes that Dunker himself, a psychologist studying how solvers think rather than the objective structure of the problem, never spotted this pattern in his own data — 'the logic of analysis has forced Dunker to join the answers 4 and 13, but he has not reviewed his own answers to variant 4 and has not seen that it led the examinee away from the right path' — the rule was invisible without first sorting elements into fixed-natural versus controllable-instrument. Diagnostic move: before generating candidate fixes, sort every element in the conflict into 'given, not redesignable' (a natural object, a person, an already-fixed external party or constraint) versus 'built by us, fully controllable' (the instrument, tool, or medium) — then discard, without further consideration, every candidate that proposes changing an element from the first category, and concentrate search effort entirely on the second."
