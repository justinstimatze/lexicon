id: lex-j3vgx
name: acquisition-cost-can-be-cheaper-than-the-upkeep-it-commits-you-to
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When evaluating whether to acquire an asset, price the recurring cost of maintaining it separately from the one-time cost of getting it, since the two can diverge sharply and the smaller number is not always the acquisition. Franklin's Poor Richard: 'It is easier to build two chimneys, than to keep one in fuel.' Building a second chimney is a bounded, one-time expense. Fueling even one chimney has no such bound — it recurs every winter for as long as the chimney stands, and the total climbs with each passing year. The comparison flips the intuition that more of a thing costs more than less of it. Here the fixed asset can be doubled for less than a single instance of its variable cost, because acquisition draws on one budget and upkeep draws on another with a completely different time horizon."
related: []
evokes: [franklin, way-to-wealth, fixed-cost-versus-recurring-cost-asymmetry, upkeep-cost-exceeds-acquisition-cost]
