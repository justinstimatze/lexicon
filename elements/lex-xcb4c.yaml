canonical-instances:
  - "A support engineer personally accountable for a customer's unresolved outage starts privately concluding either that they're simply bad at their job, or that the customer's environment is uniquely broken and unfixable by anyone — when the accurate answer, that the underlying bug is a known, unsolved class of problem across the whole industry, offers neither of them the satisfaction of a target to act on."
  - "A social worker with an unresolved, high-stakes case oscillates between 'I'm failing this family' and 'this family won't help themselves' as the case drags on despite real effort — both attributions relieve the intolerable feeling of an intractable structural problem (housing scarcity, systemic barriers) that no amount of individual skill on either side would resolve."
critical-questions:
  - "Does explicitly naming the third option ('this may be a genuine field-level limit, not anyone's fault') to a person in this state actually help, or does the emotional pressure to find someone to blame override an offered reframe, the way frustration-driven cognition often resists correction by information alone?"
  - "Are self-blame and other-blame actually interchangeable outlets for the same underlying pressure, or does something about the specific case or the specific person predict which direction the blame goes — Fox's own two examples split evenly between the two, but doesn't identify what determined which student went which way."
