id: lex-e2yxr
name: gesture-speech-mismatch-signals-readiness-to-learn
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Apply this when assessing whether someone (a student, a trainee, a collaborator thinking aloud) is ready to learn a specific skill or concept, and speech is the only channel you're attending to. Susan Goldin-Meadow's finding: when a person's hand gestures convey different, non-conflicting information than their simultaneous speech about the same problem -- a 'gesture-speech mismatch' -- this reveals they hold two not-yet-integrated representations or strategies of the problem at once, one expressed in speech, one only in gesture. This is not conflict; there is almost always a framework that would reconcile the two pieces, but the speaker has not yet built that framework, whether over developmental time or conversational time. Demonstrated causally, not just correlationally: children classified as 'mismatchers' before instruction learned significantly more from the SAME instruction than 'matchers' -- despite performing identically on the pretest -- and this held across two independent task domains (Piagetian conservation, mathematical equivalence) and generalized into adulthood. The diagnostic value is specific: mismatch predicts readiness-to-learn better than the content of speech alone, because it detects an internal state (holding two representations) the person cannot yet articulate. Practitioner move: when someone's hands are doing something their words aren't accounting for, that gap -- not the words -- is where to aim instruction; the mismatch marks them as being on the precipice of learning, not as confused."
related: [lex-hng49, lex-hfcae, lex-ngas3, lex-6sxj4, lex-nbenu]
