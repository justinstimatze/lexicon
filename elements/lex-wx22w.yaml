    quote: "Haste thee, Sir Redbeak, to be gone; / Why dost thou sit and dream alone? / Come tell me, prithee, bird of spring, / To this dead stump why dost thou cling?"
canonical-instances:
  - "A recruiter tells a loyal ten-year employee that staying at a company mid-layoffs, with everyone else already updating their resumes, is simply irrational, framing the obvious career move as the only sensible read of the situation."
critical-questions:
  - "Is the pragmatic advice ever actually correct, and if it is sometimes right and sometimes a trap, what tells the listener which case they're in before they act?"
