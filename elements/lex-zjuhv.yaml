lineage:
  - source: primary
    text: sen-1970-collective-choice-and-social-welfare
    citation: "Amartya Sen, Collective Choice and Social Welfare (Expanded Edition, Penguin Books, 2017, ISBN 9780241244609), New Introduction, Chapter A1 'Enlightenment and Impossibility,' p.li. Sen builds this two-option case from a cake-division example in Arrow (1983), p.87; the setup (option x: an equal three-way split; option y: person 1 gets nothing, persons 2 and 3 split the rest) is paraphrased here since the source presents it as a two-item enumerated list."
    quote: "“There is no problem of intransitivity here (because there are only two distinct states), and no absence of majority winner (y wins over x by a two-to-one majority). But in what sense is y a ‘satisfactory’ welfare-economic outcome in this choice problem? Person 1 has been driven completely to the wall and 2 and 3 have been fattened up more. It is very hard to maintain that the majority rule is ‘a plausible way of aggregating preferences’ for these welfare-economic judgements.”"
canonical-instances:
  - "Hypothetical: A three-partner firm votes on how to split a windfall bonus, choosing between an even three-way split and a plan that hands the whole bonus to whichever two partners vote together. The two-partner plan wins two-to-one, cleanly, with no procedural irregularity anywhere -- and the excluded partner walks away with nothing, by a vote that passed every test a vote-counter would apply."
  - "Hypothetical: A homeowners' association board of three votes on redirecting a shared maintenance fund. One member proposes splitting a surplus evenly among all three property types represented; another proposes routing the entire surplus to the two property types that happen to hold two of the three votes. The second motion carries two-to-one, procedurally spotless, while the third property type's owners get nothing back on assessments they paid into equally."
critical-questions:
  - "Isn't this just describing ordinary coalition politics -- don't majorities forming around their own interest happen in every voting system, formally clean or not? Yes, and that's exactly Sen's point: the formal cleanliness (no cycling, a decisive winner) doesn't do any work toward ruling this out. The diagnostic isn't that majority rule is uniquely bad here; it's that passing every test social choice theory checks for (transitivity, decisiveness) leaves the distributive question completely open, and mistaking formal health for fairness is the actual error."
  - "Does this mean majority rule should never be used for economic decisions -- is Sen arguing for abandoning it? No -- Sen explicitly separates the domains: majority rule keeps considerable plausibility for political decision-making, and the argument here is narrower, that it makes little sense as a general aggregation method specifically for welfare-economic questions like dividing resources. The diagnostic is about knowing which kind of question you're using the procedure for, not a blanket verdict on the procedure itself."
