id: lex-dac3u
name: address-yourself-by-name-to-convert-observation-into-a-binding-resolve
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'A person can address themselves by their own name in direct second person as a rhetorical device to convert an external observation into an internally binding resolution, externalizing the self as an object of judgment to compel action. In the Jataka''s tale of Susima, the king does exactly this to break his own infatuation: "He admonished himself, saying, ''Susima, you have become old in your youth; all this time sunk in the mud of desire, like a village pig wallowing in filth and mire, you cannot leave it: quit desires, and become an ascetic in the Himalaya: it is high time for the religious life.''"'
related: []
evokes: [jataka, sattanipata, susima-jataka, self-address-as-admonishment, illeism-for-internal-resolve]
lineage:
  - source: primary
    text: jataka-chalmers1895-susima-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VII (Sattanipata), No. 411, Susima-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "He admonished himself, saying, \"Susima, you have become old in your youth; all this time sunk in the mud of desire, like a village pig wallowing in filth and mire, you cannot leave it: quit desires, and become an ascetic in the Himalaya: it is high time for the religious life,\""
canonical-instances:
  - "Struggling to quit a habit that direct self-talk hasn't touched, someone starts silently addressing themselves by name in the moment of temptation, and finds the third-person framing does what first-person resolve couldn't."
critical-questions:
  - "Why would addressing yourself by name in the second person carry more force than the identical thought phrased in the first person — is there real evidence the distance itself changes behavior, or is this a stylistic flourish that doesn't add anything?"
  - "Does this technique work equally well applied silently and applied out loud, or does something change when the self-address becomes audible to others?"
status: active
