lineage:
  - source: primary
    tradition: bommasani-foundation-models
    text: bommasani-2021-foundation-models
    citation: "Rishi Bommasani et al., 'On the Opportunities and Risks of Foundation Models,' arXiv:2108.07258 (Center for Research on Foundation Models, Stanford, August 2021). Abstract."
    quote: "AI is undergoing a paradigm shift with the rise of models (e.g., BERT, DALL-E, GPT-3) trained on broad data (generally using self-supervision at scale) that can be adapted to a wide range of downstream tasks. We call these models foundation models to underscore their critically central yet incomplete character. […] Though foundation models are based on standard deep learning and transfer learning, their scale results in new emergent capabilities, and their effectiveness across so many tasks incentivizes homogenization. Homogenization provides powerful leverage but demands caution, as the defects of the foundation model are inherited by all the adapted models downstream."
  - source: primary
    tradition: bommasani-foundation-models
    text: bommasani-2021-foundation-models
    citation: "Rishi Bommasani et al., 'On the Opportunities and Risks of Foundation Models,' arXiv:2108.07258 (Center for Research on Foundation Models, Stanford, August 2021). Section 1.1 (Emergence and homogenization)."
    quote: "The significance of foundation models can be summarized by two words: emergence and homogenization. Emergence means that the behavior of a system is implicitly induced rather than explicitly constructed; it is both the source of scientific excitement and anxiety about unanticipated consequences. Homogenization indicates the consolidation of methodologies for building machine learning systems across a wide range of applications; it provides strong leverage towards many tasks but also creates single points of failure."
canonical-instances:
  - Foundation models in AI (GPT-3/4, BERT, DALL-E, Claude, Gemini) — homogenization at the model layer; biases or capability gaps in the foundation model propagate to every downstream application that fine-tunes from it.
  - Gros Michel banana monoculture — 1950s near-total collapse from Panama disease because the entire global crop shared one cultivar; Cavendish replacement now faces the same risk from Tropical Race 4.
  - The 1845-1849 Irish Potato Famine — heavy dependence on a small number of potato cultivars meant a single phytophthora-infestans strain produced catastrophic crop failure; biological diversity in cultivars would have softened the blow.
  - Cloud provider concentration — AWS US-East-1 outages take down significant fractions of the internet because countless downstream services share that substrate; multi-region or multi-cloud deployments are the resilience pattern.
  - Single-codec / single-protocol dependencies in security-critical infrastructure (OpenSSL Heartbleed 2014, Log4j 2021) — a defect in one library cascaded to thousands of downstream systems within days.
  - DNS root-zone concentration, certificate-authority concentration, BGP routing infrastructure — all exhibit the same shape; their substrate-shared properties give massive leverage but require careful resilience design.
  - University-credential dependence — homogenization of degree-credential as labor-market signal gives strong leverage to the credential issuer; defects (cost inflation, declining signal quality, narrow accreditation) propagate to all downstream credential consumers (employers, government licensing).
severity-tier: warning
