id: lex-srj3h
name: harm-principle-self-protection-as-sole-warrant-for-coercion
type-in: question
type-out: claim
_tier: atomic
agent-instruction: "When considering coercion (state, organizational, interpersonal), Mill's harm principle: only self-protection or protection of others from direct harm warrants it. Moralism, paternalism, and offense-prevention don't qualify. Test the coercion against the harm test before accepting."
related: [lex-wy3r4, lex-r3w25, lex-v6kmc, lex-wjwuc, lex-cedkm, lex-kfk68, lex-7mdpd, lex-d6vbs, lex-ewjec, lex-4nunt, lex-xj7s3, lex-xuwr2, lex-zfxbw, lex-kjb2b, lex-dfgda, lex-pdpen]
evokes: [sovereign-over-his-own-body-and-mind, the-only-purpose-for-which-power, conduct-which-concerns-others, his-own-good-not-sufficient-warrant]
lineage:
  - source: primary
    text: mill-1859-on-liberty
    citation: "John Stuart Mill, *On Liberty* (1859), Chapter I 'Introductory'. (Project Gutenberg #34901). The harm-principle is Mill's canonical demarcation of when society may interfere with individual liberty: only to prevent harm to others. Self-regarding conduct (where the agent's choices affect only themselves) is outside society's legitimate sphere of compulsion — though it may still be subject to remonstration, persuasion, advice. Foundational to subsequent liberal political philosophy; still the dominant frame in Anglo-American legal and political theory."
    quote: "[Mill, On Liberty Ch.I ¶9:] 'The object of this Essay is to assert one very simple principle, as entitled to govern absolutely the dealings of society with the individual in the way of compulsion and control, whether the means used be physical force in the form of legal penalties, or the moral coercion of public opinion. That principle is, that the sole end for which mankind are warranted, individually or collectively, in interfering with the liberty of action of any of their number, is self-protection. That the only purpose for which power can be rightfully exercised over any member of a civilised community, against his will, is to prevent harm to others. His own good, either physical or moral, is not a sufficient warrant. He cannot rightfully be compelled to do or forbear because it will be better for him to do so, because it will make him happier, because, in the opinions of others, to do so would be wise, or even right. These are good reasons for remonstrating with him, or reasoning with him, or persuading him, or entreating him, but not for compelling him... The only part of the conduct of any one, for which he is amenable to society, is that which concerns others. In the part which merely concerns himself, his independence is, of right, absolute. Over himself, over his own body and mind, the individual is sovereign.' [The structural claim: the legitimate range of coercion is bounded by harm-to-others; self-regarding conduct is outside the coercion-permitted zone, even when bad-for-the-agent.]"
  - source: practitioner
    text: feinberg-1984-the-moral-limits-of-the-criminal-law
    citation: "Joel Feinberg, *The Moral Limits of the Criminal Law* (4 vols, 1984-1988). Tier-3 deepening source: Feinberg's monumental study extends and refines Mill's harm-principle, proposing additional liberty-limiting principles (offense-principle, legal-paternalism, legal-moralism) and developing rigorous accounts of what counts as 'harm to others'. Vol 1 *Harm to Others* (1984) is the canonical analytic treatment."
    quote: "[Tier-3 deepening — Feinberg 1984: distinguishes 'harm' as setback to interest (welfare-interests + ulterior-interests) from related concepts (offense, hurt, wrong). The harm-principle is a NECESSARY condition for legitimate state coercion in Feinberg's framework but may need supplementation by an offense-principle for cases like public-indecency. Transferable refinement: don't take Mill's bilateral 'A harms B' too literally — modern complex societies require careful accounts of probabilistic, statistical, and aggregate harms.]"
  - source: practitioner
    text: dworkin-1986-laws-empire
    citation: "Ronald Dworkin, *Law's Empire* (1986) and the broader equality-of-resources liberal program. Tier-3 deepening: Dworkin's liberal-egalitarian framework is heir to Mill's harm-principle but adds substantive equality-of-concern claims. The Dworkin frame: equal respect for persons + treating-as-equals are the foundational commitments; the harm-principle is the operational rule that follows from these commitments."
    quote: "[Tier-3 deepening — Dworkin's claim that the harm-principle is best understood as a corollary of a deeper equality-of-concern principle: the state must treat citizens as equals, which means not preferring some lifestyles to others by coercion. This generates Mill's conclusion (only harm-to-others justifies coercion) from a different foundation (equality-of-respect) than Mill's own utilitarian foundation. The transferable lesson: the harm-principle is multiply-anchored; you can endorse it without endorsing Mill's broader utilitarianism.]"
  - source: primary
    text: dworkin-1986-laws-empire
    citation: "Ronald Dworkin, Law's Empire (Cambridge, MA: Belknap Press of Harvard University Press, 1986). Chapter 7, 'Integrity in Law,' section 'Liberalism and Contradiction' (main text p. 275), together with note 19 to that section (Notes, p. 441). Responding to critical legal studies' claim that liberal political theory is internally self-contradictory, Dworkin restates and defends the grounding of liberal neutrality among competing conceptions of the good: government's refusal to legislate on the basis of preferring one way of life to another is not grounded in skepticism about value, but in the deeper, non-skeptical commitment that citizens must be treated as equals by their government. This is the specific claim the earlier practitioner-tier citation above already summarizes as Dworkin's view that the harm-principle is a corollary of a deeper equality-of-concern principle — the operational content of official neutrality toward 'theories of what is valuable in life' is what, applied to personal conduct that does not injure others, yields the harm-principle's practical result."
    quote: "[Chapter 7 'Integrity in Law,' section 'Liberalism and Contradiction,' note 19 (Notes to Pages 274-275, p. 441), Dworkin quoting his own earlier essay 'Liberalism' (reprinted in A Matter of Principle, 1985, p. 203) to restate why liberal neutrality is not grounded in skepticism about value:] 'the constitutive morality of liberalism is a theory of equality that requires official neutrality amongst theories of what is valuable in life... liberalism cannot be based on skepticism. Its constitutive morality provides that human beings must be treated as equals by their government, not because there is no right and wrong in political morality, but because that is what is right... Liberalism is not self-contradictory: the liberal conception of equality is a principle of political organization that is required by justice, not a way of life for individuals.'"
canonical-instances:
  - "drug-policy debates: should the state criminalize self-regarding drug use? Pure harm-principle position (Mill): no — adult consensual self-affecting conduct is outside legitimate state coercion. Mainstream paternalist position: yes — state may protect agents from themselves. The transferable framing is to make the operative premise explicit; many disagreements collapse to whether one accepts Mill's strict bound or some form of paternalist extension"
  - "speech regulation: the harm-principle is the dominant US-First-Amendment framework — speech is permitted unless it constitutes specific harm to others (incitement, true threats, defamation). The European framework (hate-speech laws) extends the harm account to include dignitary-harm and aggregate-social-harm. The Mill frame supplies the demarcation criterion; jurisdictions disagree on how broad 'harm' is"
  - "professional-licensing regimes: should the state require licenses to be a barber, hair-braider, taxi-driver? Strict harm-principle reading: only if unlicensed practice creates real harm-to-others (medical-licensing-yes, hair-braiding-licensing-probably-no). Public-choice critiques of occupational licensing operate from this Millian frame"
  - "consent-respecting medical decisions: the patient who refuses life-saving treatment for personal/religious reasons. Mill's harm-principle: state may not coerce treatment of competent self-affecting choices. Modern bioethics largely accepts this; the difficult cases are where consent is questionable (minors, mental illness, end-of-life)"
  - "the offense-vs-harm distinction in public-decency cases: someone behaving in a way others find offensive but not harmed by — Mill's strict frame says state may not coerce; Feinberg's extension adds an offense-principle for cases above a threshold (extreme + reasonable-to-avoid). The transferable challenge: where is the threshold between harm and offense, and who decides"
  - "operationally tightly coupled to lex-cedkm experiments-of-living: lex-srj3h is the LIMIT on coercion (the negative side of liberalism); lex-cedkm is the POSITIVE reason for that limit (because diverse modes of life are themselves valuable). They co-fire as the two halves of Millian liberal-political-philosophy; lex-srj3h without lex-cedkm is libertarianism-as-individual-property-rights; lex-cedkm without lex-srj3h is romantic-individualism-without-political-implementation"
  - "operationally adjacent to lex-v6kmc dichotomy-of-control: the Stoic dichotomy is descriptive (what's yours to control + what isn't); Mill's harm-principle is normative (where coercion is legitimate). They share an underlying structural primitive: a demarcation between self-domain and other-domain that organizes practical reason. Cross-tradition convergence — Stoic + Mill both anchor practical wisdom in a clean self-vs-other boundary, though they put it to different work"
  - "the transferable rule for institutional design: when proposing a policy that restricts behavior, ask 'whom does this protect, and from what harm?' If the answer is 'the agent themselves' (anti-paternalism case), Mill's frame demands either an additional principle (Feinberg-style extension) or rejection. If the answer is 'third parties' (harm-account), the policy is on Millian ground and the question shifts to whether the harm-claim is well-supported"
critical-questions:
  - "what counts as 'harm to others'? Mill writes loosely; subsequent literature (Feinberg, Dworkin) develops rigorous accounts. Problems: (a) probabilistic harm (smoking around others, drunk-driving) — when does risk become harm; (b) aggregate harm (climate change, public-health externalities) — how does the individual contribution count; (c) dignitary harm (hate speech, harassment) — is it harm or offense; (d) downstream harm (radicalizing media, cumulative effects). The transferable position: the principle's content depends on the harm-account you adopt"
  - "is the self-regarding/other-regarding distinction sharp enough to do the work? Communitarian critique (Sandel, MacIntyre, Taylor): most putatively-self-regarding conduct affects others through social-fabric channels (the alcoholic's family, the addict's community, the suicide's loved ones). Mill anticipates this (Ch.IV) but resists letting it swallow the principle. The transferable defense: the criterion is direct harm-to-determinate-others, not indirect/social-fabric effects, even if the latter exist"
  - "does the harm-principle apply only to political coercion, or to social pressure too? Mill explicitly includes both (Ch.I ¶9: 'physical force in the form of legal penalties, or the moral coercion of public opinion'). The modern social-shaming + cancellation-pressure debate is squarely on this terrain — Mill's frame says aggressive social pressure on self-regarding conduct is as illegitimate as state coercion would be. Contested in practice; the transferable rule retains Mill's broad reading"
  - "is the principle empirically defensible for all populations? Mill explicitly restricts it (Ch.I ¶10) to 'human beings in the maturity of their faculties' — excluded children, those incapable of being guided by free discussion. The exception-clauses have aged badly (Mill's framing of 'backward states of society' reflects Victorian-colonial assumptions); the modern reformulation grounds the same exception in capacity-for-autonomous-choice rather than developmental-stage-of-civilization. Transferable: the exception applies to agents lacking full capacity, defined developmentally + clinically, not culturally"
status: active
