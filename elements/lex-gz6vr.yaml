id: lex-gz6vr
name: subordinating-a-concept-to-a-new-value-transforms-its-meaning
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When the same named concept moves from being someone's top priority to being subordinate to a different governing value, don't assume it just gets applied less often or less forcefully -- check whether what it actually licenses has changed. Lakoff's case is the resource metaphor for nature. Under Strict Father morality, nature-as-resource means nature exists for man's profit, constrained only by frugality: use what you want, just don't waste it. The identical metaphor survives inside Nurturant Parent morality, but there it's subordinate to the master value of nurturance -- and a nurturer must itself be nurtured back. That single change of governing value adds a requirement the metaphor never carried on its own: sustainability. The resource metaphor didn't get weaker under Nurturant Parent morality, it got a different job description. The same pattern holds for the work-of-art metaphor: under Strict Father priorities it's a separate aesthetic add-on, admiring nature's beauty from outside; subordinated to nurturance, the aesthetic experience becomes inseparable from the nurturing relationship itself, not a view you take of it afterward. Diagnostic move: when a concept keeps its name across two systems that rank it differently, don't assume the concept itself stayed fixed while only its priority moved -- check whether the governing value at the top has actually rewritten what the subordinate concept is allowed to mean."
related: []
evokes: [george-lakoff, moral-politics-1996, nature-as-resource, subordinate-metaphor, sustainability]
lineage:
  - source: primary
    text: lakoff-1996-resource-metaphor-transformed-by-nurturance
    citation: "George Lakoff, Moral Politics: How Liberals and Conservatives Think (University of Chicago Press, 3rd ed., 2016), Chapter 12 'Regulation and the Environment.' The chapter text is the unrevised second-edition (1996) text; the third edition adds a new preface and a 2016 afterword around it."
    quote: "“Take, for example, the resource metaphor. This moral system assumes not the domination of man over nature, but the interdependence of man and nature. Nature is a resource to someone nurtured by nature, but the nurturer must be nurtured too—we must take care of the earth. This entails the notion of sustainability. Nurturance requires interdependence if it is to be sustained; the same is true of our relationship to nature. The resource metaphor, in the context of the nurturance metaphor, implies sustainability, a central ecological concept.”"
canonical-instances:
  - "The direct textual anchor, on the work-of-art metaphor's parallel transformation: 'Since nurturance is an aesthetic experience, the work-of-art metaphor applies, but in a very different way... The aesthetic experience is part of nurturing,' rather than a separate judgment of prettiness layered on top of an otherwise unrelated relationship."
  - "Hypothetical: two software teams both claim 'code quality' as a value. On the first team, code quality is subordinate to shipping velocity -- clean code means whatever ships fast without immediately breaking. On the second team, code quality is subordinate to long-term maintainability -- clean code now means whatever a stranger could safely modify two years from now, which rules out several things the first team's definition would happily allow. Both teams can point to the identical phrase in their engineering handbook and mean structurally different things by it, not because one team cares more, but because a different governing value rewrote what the phrase is allowed to require."
critical-questions:
  - "If subordinating a concept to a new master value can add requirements the concept never had (sustainability wasn't part of 'resource' on its own), what stops a governing value from adding literally any requirement it likes, making the subordinate concept an empty vessel that means whatever the master value needs it to mean? Is there a limit on how much a subordinate concept can be rewritten before it stops being recognizably the same concept at all?"
  - "Lakoff shows the mechanism working through addition (resource gains a sustainability requirement) and through integration (aesthetic judgment merges into the nurturing relationship itself). Are these actually the same underlying transformation, or two different things -- a governing value can ADD a constraint the subordinate concept didn't have, and separately can DISSOLVE a boundary the subordinate concept used to have -- that happen to both get called 'meaning changes under subordination'?"
status: active
