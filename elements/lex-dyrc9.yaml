id: lex-dyrc9
name: mourning-an-abstract-principle-as-though-it-had-personally-died
type-in: situation
type-out: process
_tier: atomic
agent-instruction: 'Someone who believes the moral order itself has failed — because wrongdoers appear to be flourishing — can perform a funerary or sacrificial ritual for the abstract principle as if it had literally died, externalizing an inarticulate sense of cosmic injustice into one concrete, legible act. The performance itself, not any argument, is what draws outside attention and intervention. In the Jataka''s tale of Kaccani, the cast-out mother does exactly this: "The old woman heard that the son''s birth was thought to be due to her leaving the house, and she thought, "Surely Right must be dead in the world: [425] if it were not so, these people would not have got ason and a comfortable life after beating and casting out their mother: I will make an offering for the dead Right.""'
related: []
evokes: [jataka, atthanipata, kaccani-jataka, ritual-protest, performative-grief-for-a-principle]
lineage:
  - source: primary
    text: jataka-chalmers1895-kaccani-jataka
    citation: "The Jataka, or Stories of the Buddha's Former Births, Vol. III, trans. H. T. Francis and R. A. Neil, ed. E. B. Cowell (Cambridge University Press, 1897), Book VIII (Atthanipata), No. 417, Kaccani-jataka. Verified verbatim against a direct extraction of the held copy."
    quote: "The old woman heard that the son's birth was thought to be due to her leaving the house, and she thought, \"Surely Right must be dead in the world: [425] if it were not so, these people would not have got ason and a comfortable life after beating and casting out their mother: I will make an offering for the dead Right.\""
canonical-instances:
  - "A longtime employee, watching a colleague get promoted right after taking credit for someone else's work, posts a single sarcastic line about 'a moment of silence for meritocracy' instead of filing any formal complaint — and it's the post, not a memo, that gets HR's attention."
critical-questions:
  - "Is the ritual gesture aimed at summoning outside help, or is it simply the only outlet available once direct appeal has already failed?"
  - "What does it mean, practically, for someone to act as though an abstract principle like justice can literally die — does treating it as a person change what response the gesture can produce?"
status: active
