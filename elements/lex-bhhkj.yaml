id: lex-bhhkj
name: a-theorys-key-evidence-presupposes-what-it-denies
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a theory denies that some category of thing exists (an objective world, a mind-independent fact, a real distinction), check whether the theory's own showcase evidence can even be described without secretly relying on that exact category. Reviewing Thure von Uexküll's subjectivist biology -- the doctrine that reality is nothing but 'the sum total of the biological release signals' relative to each organism, with no objective world beyond it -- Popper traces an accusation that boomerangs on the accuser. Uexküll charges Konrad Lorenz with reasoning in a circle for assuming animals adapt to an objective external world. Popper's reply: 'I have no doubt that the accusation of arguing in a circle falls back on Uexküll, and that his faulty reasoning is at least partly due to his untenable subjectivist interpretation of modern physics. For Uexküll overlooks the fact that his whole biological analysis presupposes the possibility of a (more or less) objectivist approach. It is only such an approach which enables us to speak, for example, of an ‘imitative contraption’ taking over the functions of a bird’s mother. It is only because we know—in our ‘objective’ world, which goes beyond the bird’s ‘subjective’ world—what its real mother is, and what a contraption is, that we can say that, if animal A differentiates by its actions between its real mother and an imitative contraption of a certain kind while animal B does not, then A has, to that extent, the greater powers of discrimination or differentiation.' Uexküll's whole case for his theory rests on an experiment where a fake mother fools a young bird -- and calling anything a fake, a dummy, or a fooling at all already requires a vantage point from which the real mother is known, independent of what the bird's own subjective world contains. The theory cannot state its own best evidence without borrowing the very thing it claims doesn't exist. Diagnostic move: when a theory denies some category outright, find its strongest piece of supporting evidence and check whether describing that evidence, not just believing it, requires assuming the category is real after all."
