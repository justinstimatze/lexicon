id: lex-nqpkn
name: reliability-in-one-relationship-does-not-transfer-to-another
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "An actor's trustworthiness is not a single global property they carry into every relationship -- it can be genuinely, completely reliable in one domain or toward one party while remaining genuinely, completely unreliable in another domain or toward a different party, with neither fact undermining or predicting the other. Hyde documents this as a stable feature of Hermes rather than an inconsistency to be explained away: 'Very often he is the faithful servant of Zeus. At the end of the Iliad, for example, Priam must go to Achilles to ransom Hector's body, and Zeus sends Hermes to guide the old man past the guards. This he does surely. He faithfully executes the will of Zeus... there is never any anxiety about what he'll do.' Yet in the very same breath Hyde insists this reliability is bounded, not general: 'there are certain areas in which Hermes is not to be trusted at all. First of all, when the gods themselves are at odds, Hermes is still the trickster, siding with stolen love, theft, and shameless behavior. ... Second... he is never brought into line where mortals are concerned: the closing lines of the Hymn say that \"most of the time, when night has fallen, he deceives the race of those who must die.\"' The same figure is simultaneously the god you can send on any errand without a second thought and the god who will deceive you if you happen to be human rather than divine, or if the errand touches theft, love, or interdivine rivalry. Diagnostic move: before extending or withholding trust based on someone's track record, specify the relationship and domain that track record was actually built in -- perfect reliability toward one party or in one kind of task is not evidence of reliability toward a different party or in a structurally different kind of task, and treating trust as a single transferable quantity, rather than a set of separate, domain-bound records, is how a genuinely two-sided reputation gets flattened into a false and misleading average."
