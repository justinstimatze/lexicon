id: lex-v64dh
name: two-incompatible-attentions-need-separate-systems
type-in: situation
type-out: frame
_tier: atomic
agent-instruction: "Apply this when a system (biological, organizational, or computational) needs to run two attentional or processing modes that are functionally incompatible — not merely different, but mutually exclusive in the sense that engaging one degrades the other while it runs — and the instinctive fix is to build 'one flexible system that does both.' McGilchrist's diagnostic case (drawn across birds, animals, and humans): one mode of attention is narrow, focused, and manipulative — it isolates a single target from its surroundings and holds it fixed in order to grasp, categorize, or act on it (a predatory bird's eye locking onto prey; a toad's left-hemisphere-mediated prey-strike). The other mode is broad, vigilant, and relational — sustained awareness of the whole field of surroundings, open to whatever else might be present (predators, mates, novel objects) — a mode that cannot be narrowed onto one thing without losing exactly the peripheral awareness that is its function. 'The left hemisphere yields narrow, focussed attention, mainly for the purpose of getting and feeding. The right hemisphere yields a broad, vigilant attention, the purpose of which appears to be awareness of signals from the surroundings... It might then be that the division of the human brain is also the result of the need to bring to bear two incompatible types of attention on the world at the same time.' This is corroborated across species by convergent, independent lateralization: pigeons categorizing images use a 'local' feature-matching strategy in the left hemisphere and a 'global' whole-comparison strategy in the right; toads attend to prey with the left hemisphere but to fellow toads (social/relational awareness) with the right — the SAME animal needing both modes AT THE SAME TIME (watch for a predator while catching this specific fly), unable to get both from one undifferentiated system. Practitioner move: when a system's design keeps drifting toward 'add a mode-switch, do X or do Y' and X and Y are actually needed CONCURRENTLY, not sequentially, stop looking for one unified process configurable to both. Check whether the two modes are structurally incompatible (narrow-exclusive vs broad-inclusive attention is the paradigm case) and, if so, build them as separate concurrent subsystems with a coordination layer between them, rather than one flexible system trying to be both. The diagnostic tell that distinguishes this from an ordinary design tradeoff: the two modes aren't just different points on a dial (more vs less zoom) where you can settle on a blended middle setting — engaging one measurably degrades the other's function while it is active, so 'a bit of both, continuously' is not on offer; a single unified channel delivers one or the other at any given moment, however it is tuned."
related: [lex-cdc5g, lex-udyax]
scaffolds-from: [lex-cdc5g]
evokes: [narrow-focused-grasping-attention, broad-vigilant-relational-attention, toad-attends-prey-left-hemisphere-social-right, pigeon-local-vs-global-categorization-strategy, single-channel-cannot-run-both-at-once, lateralization-is-not-space-saving]
lineage:
  - source: primary
    text: mcgilchrist-2009-the-master-and-his-emissary
    citation: "Iain McGilchrist, *The Master and His Emissary: The Divided Brain and the Making of the Western World* (Yale University Press, 2009), Chapter 1 'Asymmetry and the Brain' and Chapter 2 'What Do the Two Hemispheres 'Do'?'."
    quote: "'In general terms, then, the left hemisphere yields narrow, focussed attention, mainly for the purpose of getting and feeding. The right hemisphere yields a broad, vigilant attention, the purpose of which appears to be awareness of signals from the surroundings, especially of other creatures, who are potential predators or potential mates, foes or friends... It might then be that the division of the human brain is also the result of the need to bring to bear two incompatible types of attention on the world at the same time, one narrow, focussed, and directed by our needs, and the other broad, open, and directed towards whatever else is going on in the world apart from ourselves.' ... 'The right hemisphere underwrites breadth and flexibility of attention, where the left hemisphere brings to bear focussed attention.' (McGilchrist, The Master and His Emissary, 2009, Ch.1 pp.28-29 / Ch.2 opening)"
canonical-instances:
  - "operationally distinct from lex-cdc5g (Blake's contraries — maintain rather than resolve): both argue against collapsing two poles into one merged/synthesized system, but lex-cdc5g is a general methodological injunction about WHEN to resist synthesis of any two opposing principles; this atom is the specific empirical/architectural claim about why two particular attentional modes cannot share one physical channel simultaneously, with convergent cross-species evidence. They compose — this atom is a concrete instance class of lex-cdc5g's broader discipline — rather than duplicate."
  - "The core cross-hemisphere finding (Ch.1-2): the left hemisphere yields narrow, focused attention for isolating and manipulating a target; the right hemisphere yields broad, vigilant attention for awareness of the wider field; McGilchrist frames this as the likely reason the brain is lateralized at all, rather than a space-allocation accident."
  - "Toads attend to their prey with the left hemisphere but interact with their fellow toads (social awareness) using the right hemisphere — the same animal needing both narrow-target-lock and broad-social-vigilance at potentially the same moment, unable to source both from one undifferentiated system."
  - "Pigeons categorizing pictures of everyday scenes use two distinct hemisphere-specific strategies simultaneously available to the same animal: the left hemisphere groups images by a 'local' strategy (invariant particular features present), the right hemisphere by a 'global' strategy (comparison of the thing as a whole against an ideal exemplar)."
  - "Predatory birds and animals latch onto prey through the right eye and right foot (left hemisphere); this left-hemisphere prey-lock is a convergent, independently-evolved pattern across diverse vertebrate lineages, consistent with the incompatibility being a structural necessity rather than a contingent human peculiarity."
critical-questions:
  - "Isn't this just requisite variety (lex-g9b38) — needing more response-types to match more disturbance-types? No. Requisite variety is about a regulator needing enough distinct RESPONSES to match a disturbance's distinct CONDITIONS; it says nothing about two response-types being mutually exclusive within a single channel. This atom's claim is stronger and more specific — the two attentional modes actively degrade each other if run through the same undifferentiated system, which is why they need physically separate, SIMULTANEOUSLY ACTIVE channels, not merely a larger response repertoire in one channel."
  - "Couldn't a fast enough switch between modes substitute for true simultaneity? The cross-species evidence argues no — a toad needs to watch for predators WHILE its left hemisphere is locked onto a specific prey item; a sequential switch would leave it unguarded during the window when attention is narrowed. The claim is about genuine concurrency, not fast alternation dressed up as simultaneity."
  - "Is 'incompatible' too strong — don't organisms routinely divide attention across two things? Dividing attention across two OBJECTS within the same mode (tracking two moving targets) is a different claim from this atom's. The incompatibility here is between two MODES of attending (narrow-exclusive vs broad-inclusive), not between two objects within one mode — the claim is that the mode itself, not the object count, is what cannot be doubled up in a single channel."
