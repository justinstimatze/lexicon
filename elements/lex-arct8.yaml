canonical-instances:
  - "Table 21 in the essay puts numbers on the pattern: of first-year students, 2 per cent thought of themselves as doctors in dealings with faculty, 3 per cent with classmates, 12 per cent with nurses, and 31 per cent with patients — the same cohort, at the same stage of training, holding four different self-images depending on which relationship they were currently in."
  - "A newly promoted engineer who still feels like an individual contributor in meetings with senior architects (who treat her as a peer-in-training) but already feels like a manager when a report brings her a problem to solve (who treats her as the decision-maker) — the identity shift arrives relationship by relationship, not as one switch."
  - "A first-generation graduate student who feels like an impostor around tenured faculty who signal deference to credentials, but feels like a genuine scholar around undergraduates who treat the mere fact of being a graduate student as expertise — the self-image tracks whichever audience is currently doing the assigning."
critical-questions:
  - "Does the partitioned self-image resolve into one dominant identity simply as contact-hours accumulate across all role-partners, or does one relationship (here, the one where the perceived expectation gap is smallest — patients) function as a leading edge that then pulls the others along, so the mechanism has more structure than a weighted average?"
  - "How far does this generalize beyond hierarchical, competence-based status transitions where a real capability gap plausibly differs by partner? Does the same relationship-by-relationship partitioning show up in identity transitions that are not about demonstrated skill at all (a wholly ascribed status change, a shift in group membership with no ability component), or does the mechanism specifically require an actual performance gap that varies by audience?"
