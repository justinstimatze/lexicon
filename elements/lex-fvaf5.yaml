id: lex-fvaf5
name: how-an-outcome-was-reached-is-part-of-the-outcome
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "Before describing a result purely by its end state, check whether the path to that end state is something the people involved actually care about. Sen: “It is possible to define social states in terms of what can be called 'culmination outcomes' (e.g. 'Anne got the medical support to which she was socially entitled'), or more fully described as 'comprehensive outcomes' (e.g. 'Anne exercised her socially recognized right for medical support and obtained it, rather than being given it through charity'). An articulation of the comprehensive outcome can enrich bare-bone consequential descriptions by bringing into them the processes through which the final outcomes come about.” Culmination-outcome bookkeeping records the same line either way: Anne got the support. What it erases is the entire difference between claiming an entitlement and receiving someone's charity. Diagnostic move: when comparing two ways an outcome could come about, check whether your description tracks only the end state or also the route there. If two outcomes are being treated as equivalent because they look the same at the finish line, ask whether the parties involved would actually treat them as equivalent -- if not, the description needs to become comprehensive, not just accurate."
