id: lex-58ynk
name: knowledge-of-particular-circumstances-resists-centralization
type-in: claim
type-out: frame
_tier: atomic
agent-instruction: "Recognize this when someone proposes that a central authority (planner, regulator, executive team, head office, single LLM, top-of-org committee) collect all the decision-relevant knowledge from distributed local actors, aggregate it, and issue optimal directives back down. Hayek's transferable counter: the vital decision-relevant knowledge is THE KNOWLEDGE OF PARTICULAR CIRCUMSTANCES OF TIME AND PLACE — irreducibly distributed across local actors, often not articulable in transmittable form, and necessarily lost in any aggregation that abstracts away from the specific circumstances. Hayek distinguishes (a) SCIENTIFIC knowledge of general rules — communicable, centralizable, articulable — from (b) knowledge of particular circumstances — held by individuals with intimate contact with specific situations (the shipper who knows which routes have spare capacity; the estate agent who knows neighborhood-by-neighborhood demand; the arbitrageur who spots a fleeting price disparity; the line manager who knows their machine's specific quirks; the doctor who knows their patient's specific history; the teacher who knows their student's specific gaps). Type-(b) knowledge cannot be centralized because (i) it is too voluminous and granular, (ii) it changes constantly with circumstances, (iii) much of it is tacit (the actor knows-it-when-they-see-it but cannot articulate it in transmittable form), (iv) aggregation procedures abstract away the specific circumstances by definition, losing exactly the content that makes the knowledge decision-relevant. The transferable consequence: decisions whose quality depends on knowledge of particular circumstances must be delegated to actors who have that knowledge; centralizing such decisions systematically degrades quality even if the central authority is well-intentioned and intelligent. The signal-aggregation alternative (Hayek's positive proposal): mechanisms that aggregate local knowledge into transmissible SIGNALS (prices in markets, A/B test results in product design, reputation systems in marketplaces) without centralizing the underlying knowledge. Transferable applications: microservices architecture vs monolith (Conway's law + Hayek's law); empower-the-frontline organizational design vs command-and-control; federated learning vs centralized model training; pandemic response coordination (CDC headquarters cannot manage local outbreak specifics); educational personalization (centralized curriculum cannot adapt to per-student specifics); criminal-justice reform (centralized sentencing guidelines lose case-specific context); pluralistic AI deployment (one frontier model cannot encode all local cultural norms); editorial judgment (no central style guide replaces the editor who knows the specific piece). The atom does NOT claim centralization is always wrong; it claims centralization is wrong WHEN central knowledge is type-(b) circumstance-of-time-and-place. When the relevant knowledge is type-(a) general rules, centralization is fine. Use when (i) a proposal involves a central authority making decisions whose quality depends on specific-circumstance knowledge, (ii) someone argues `we just need better data flowing up to the planner,` (iii) you are designing organizational structures and need to decide where decision-rights should live. Counter-move: characterize the decision-relevant knowledge as type-(a) or type-(b), then locate the decision-rights where the type-(b) knowledge actually lives."
