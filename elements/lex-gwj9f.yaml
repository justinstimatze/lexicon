id: lex-gwj9f
name: exhaust-mundane-causes-before-reporting-a-residual-as-real
type-in: state
type-out: process
_tier: atomic
agent-instruction: "Penzias and Wilson's 1965 letter reporting the discovery of the cosmic microwave background is a model of what NOT to claim. Their horn antenna showed 3.5 degrees of unexplained noise, and the paper spends nearly all of its length ruling out ordinary causes one at a time, by direct physical test rather than by argument: atmospheric absorption (measured against elevation angle), ohmic losses in the antenna structure (computed from its three component parts), ground-radiation pickup through the back lobe (measured with a transmitter placed at ten separate ground positions), and even leakage through the antenna's own seams -- tested by literally taping every seam shut with aluminum tape and checking for a change in the reading. Only after every mundane explanation the authors could test had been individually eliminated do they report what's left: 'the remaining unaccounted-for antenna temperature.' They stop there. The paper never says what the residual is. It doesn't propose the Big Bang, doesn't claim a discovery, doesn't even use the word 'background radiation' as an interpretation -- it hands the number to a companion paper by a different set of authors (Dicke, Peebles, Roll, and Wilkinson) to interpret. The discipline has two parts, and the second is easy to skip under pressure to be first or to look important. First, don't report an anomaly as real until you've tested away every ordinary cause you can think of, not just argued that they're unlikely. Second, once that's done honestly, report exactly what's left and stop there -- an unexplained residual is a narrower claim than an explanation for it, and whoever measures the residual isn't obligated to be the one who accounts for it. Diagnostic move: when you're looking at a result that would be exciting if a specific interpretation were true, check how much of the actual work went into ruling out the boring explanations by direct test versus how much went into making the exciting one plausible -- and notice whether the write-up claims the interpretation at all, or only the residual."
