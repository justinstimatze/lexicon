lineage:
  - source: primary
    text: hyde-duchamps-readymades-manufacture-a-crossroads-between-separate-value-systems
    citation: "Lewis Hyde, Trickster Makes This World: Mischief, Myth, and Art (Farrar, Straus and Giroux, 1998; Canongate Books 2008 edition), Chapter 5, '\"Pure Chance,\"' on Marcel Duchamp's readymades, especially the 1914 Bottle Rack. Verified verbatim against a direct ebook-convert extraction, clean text, no OCR."
    quote: "In this case the coincidence doesn’t happen to him, he makes it happen. He becomes the crossroads where things that habit has assumed must remain apart may meet. ... Duchamp used to speak of a readymade as “a kind of rendezvous,” and of this piece as “a bottle-rack which changed its destination.” It was on its way to some restaurant kitchen, perhaps, and never-made it. It was minding its own business in the marketplace when someone shoved it, and now it lives the elevated life of “art without artwork.” It was sitting in the market of useful goods, one universe of value and meaning, when Duchamp set up a rendezvous with another such universe."
canonical-instances:
  - "A teacher who wants students to notice the arbitrary conventions of formal writing doesn't lecture about them; she has students submit a text-message conversation, unedited, as a formal essay, and the unmodified object's collision with the wrong category forces the class to articulate exactly what a 'real' essay was quietly assumed to require."
  - "A designer wanting to reveal what makes a luxury product feel luxurious places an identical, unbranded item from a dollar store directly next to it on a boutique shelf with the same lighting and presentation, and the display itself, requiring no change to either object, exposes how much of the perceived value was coming from context rather than the object."
critical-questions:
  - "Does the technique depend on the audience already having strong, largely unconscious assumptions about the two categories being collided, meaning it works well for well-established boundaries (art versus commerce) but might produce no effect where categories are already blurry or contested?"
  - "Is the readymade's power a one-time trick that depletes with repetition, since Duchamp's own bottle rack was startling in 1914 but a hundred subsequent found-object artworks might no longer surprise an audience that has learned to expect this move from art?"
  - "Does manufacturing the crossroads yourself produce the same quality of revelation as a genuine, unplanned accident would, or does the audience's awareness that the collision was deliberately staged change how they receive and interpret it compared to a real coincidence?"
