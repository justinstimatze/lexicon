lineage:
  - source: primary
    text: radin-hare-breaks-the-bears-resistance-by-repeatedly-not-shooting
    citation: "Paul Radin, The Trickster: A Study in American Indian Mythology (Philosophical Library, 1956), 'The Winnebago Hare Cycle,' episode 22. Verified verbatim against a direct pdftotext -layout extraction, real text layer, no OCR."
    quote: "Thereupon Hare pointed an arrow toward his side. The bear looked askance expecting to be shot at any minute. But Hare instead ran around ahead of him and waited for him while the dogs chased him. Indeed Hare stood there and waited. Finally the bear came right up to where Hare was standing. Again Hare pointed his arrow at him, right at his heart. The bear now stopped running and simply walked. But Hare did nor shoot him. The fourth time Hare pointed the arrow at the bear he began to cry. ... Then Hare began to make fun of him saying, 'So you are not as strong-minded as you thought? Why do you cry? This is what human beings could do to you even if you did put your paw in front of the opening of your cave. If I had been one of your uncles you would have been killed by this time.'' Hare,' said the bear, 'you were right. From now on the people will be able to find me whenever they hunt for me.'"
canonical-instances:
  - "A landlord who has grounds to evict a difficult tenant serves the paperwork, lets the deadline approach, then withdraws it at the last moment, twice, before finally letting a third notice lapse without acting on it either, and the tenant, having sat through the gap each time, becomes far more compliant about rent and noise than an immediate eviction would have produced."
  - "A manager with clear cause to fire an underperforming employee schedules the termination meeting twice and calls it off each time at the door, before the employee's behavior changes permanently, not because they were fired, but because they were shown twice that they easily could have been."
critical-questions:
  - "Does the mechanism depend specifically on the target believing each aim is genuinely about to result in death, and would it work at all if the bear had suspected earlier that Hare was choosing not to shoot rather than simply failing to?"
  - "Is there a meaningful ethical difference between this kind of repeated non-lethal threat display and actual violence, given that the psychological effect described here, complete capitulation through fear, may be as damaging as a single act of harm would have been?"
  - "Would a single, real shot that missed have produced a similar effect, or does the mechanism specifically require the target to understand that each non-firing was a deliberate choice rather than an accident, luck, or incompetence?"
