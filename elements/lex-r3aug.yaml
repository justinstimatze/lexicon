agent-instruction: "When evaluating whether a deliberation has produced a just outcome, distinguish two ways impartiality can be enforced. (1) Closed impartiality — strip individuals within the group of knowledge of their own position (Rawlsian veil-of-ignorance). Removes individual vested interest within the focal group. Does NOT remove parochial conventions shared across the whole group. (2) Open impartiality — admit the judgement of a disinterested spectator from outside the group (Smithian impartial spectator). Removes group-level parochialism by importing distant views. Diagnostic question: 'whose voices are admitted to the deliberation?' If only members of the focal group, closed-impartiality at best; group parochialism is unaddressed. If outside voices are required-to-be-considered, open-impartiality. Operational consequence: a fair-process audit that asks only 'is anyone reasoning from their own narrow interest?' will not catch parochialism shared across the entire focal group. Add a second audit: 'what would this look like to an informed observer with no stake in our local conventions?' The two audits remove different biases and neither subsumes the other."
