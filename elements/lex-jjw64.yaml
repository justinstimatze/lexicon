id: lex-jjw64
name: opposed-origin-stories-can-share-the-same-politically-convenient-conclusion
type-in: situation
type-out: claim
_tier: atomic
agent-instruction: "When a debate presents itself as a choice between two fundamentally opposed accounts, check whether both sides actually share a structural assumption that matters more than which pole they favor. Graeber and Wengrow's case: Rousseau's story (humans began innocent and egalitarian, then fell through agriculture and property) and Hobbes's story (humans began in a violent state of nature, and only escaped it through state power) look like opposites, one optimistic about human nature, one pessimistic. But both assume a single evolutionary sequence of stages that every society passes through, and both cash out politically in the same place: current hierarchy and inequality are the inevitable price of complex society, so the most anyone can do is tinker at the margins. Two narratives that disagree about the starting point can still funnel toward an identical, convenient endpoint when they share the deeper premise neither side has questioned. Before accepting a debate's framing as a real fork in the road, check what both sides are quietly agreeing on -- that's usually where the actual constraint on the conversation is hiding."
