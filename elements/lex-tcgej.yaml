lineage:
  - source: primary
    tradition: schull-machine-gambling
    text: schull-2012-addiction-by-design
    citation: "Natasha Dow Schüll, Addiction by Design: Machine Gambling in Las Vegas (Princeton University Press, 2012), Chapter 2 (Engineering Experience), section 'Extending Time-on-Device'."
    quote: "As much as repeat machine gamblers want speed, they want to play for as long as possible. Their desire for 'time-on-device,' as the gambling industry terms it, moves in tandem with the industry's desire for continuous productivity. 'The key is duration of play,' a consultant told me. 'I want to keep you there as long as humanly possible — that's the whole trick, that's what makes you lose.' 'It's basically a matter of getting them into the seat and keeping them there,' echoed a machine-gambling industry insider."
  - source: primary
    tradition: schull-machine-gambling
    text: schull-2012-addiction-by-design
    citation: "Natasha Dow Schüll, Addiction by Design: Machine Gambling in Las Vegas (Princeton University Press, 2012), Chapter 4 (Matching the Market)."
    quote: "Escape players, on the other hand, otherwise known as time-on-device players or play-to-win-to-play players, are willing to forgo large jackpots for regular wins and extended play time, and so prefer 'low volatility, high hit frequency' games programmed to dispense constant little payouts (or reinforcements, in Skinnerian lingo). Known as 'drip-feed,' 'grind,' or 'dribble-pay' games, they nibble slowly at a budget until it is gone. 'Some people,' Vallejo remarked, 'want to be bled slowly.'"
  - source: primary
    tradition: schull-machine-gambling
    text: schull-2012-addiction-by-design
    citation: "Natasha Dow Schüll, Addiction by Design: Machine Gambling in Las Vegas (Princeton University Press, 2012), Introduction (Mapping the Machine Zone)."
    quote: "Echoing Mollie's wish to stay in the machine zone, they spoke of gamblers' desire for 'time-on-device,' or TOD. An evolving repertoire of technological capabilities was facilitating this desire. 'On these newer products, they can really get into that zone,' remarked a game developer from a top manufacturing company."
canonical-instances:
  - Las Vegas slot-machine floor architecture — no clocks, no windows, low ceilings, narrow aisles funneling player toward machines, all engineered to maximize time-on-device per Schüll's primary observation.
  - Mobile free-to-play games (Candy Crush, Clash of Clans) — variable-ratio reward schedules, low-volatility / high-hit-frequency tuning per player, friction asymmetry between entry (one tap) and exit (multi-step navigation).
  - Social-media infinite-scroll + push-notification systems — the platform's primary KPI is engagement-time, not user-reported satisfaction or task completion; design optimizes for the former.
  - Streaming auto-play (Netflix, YouTube) — auto-play next episode after 5 seconds; the user has to ACT to NOT keep watching, friction asymmetry as a design tool.
  - Online dating apps where the platform makes money from continued subscription, not from successful pairings; design encourages continued engagement rather than match-and-exit.
  - Some therapeutic apps (meditation, language learning) whose revenue model is subscription-retention rather than outcome — design optimizes for streak-keeping (continued engagement) not actual skill acquisition.
severity-tier: warning
