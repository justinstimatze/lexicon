lineage:
  - source: primary
    text: kahneman-2011-thinking-fast-and-slow-ch17-regression-to-the-mean
    citation: "Daniel Kahneman, *Thinking, Fast and Slow* (Farrar, Straus and Giroux, 2011), Chapter 17 'Regression to the Mean.' The canonical contemporary statement of the regression-to-the-mean primitive and its transferable decisive diagnostic: extreme outcomes regress because correlation is imperfect, and humans (and even trained statisticians) substitute causal stories for the regression. Kahneman opens with the flight-instructors-in-the-Israeli-Air-Force eureka moment: an instructor reported that praising-cadets-after-good-performance led to worse-performance-next-time, and yelling-after-bad-performance led to improvement-next-time — inferring that punishment works and praise doesn't. Kahneman: 'the instructor had attached a causal interpretation to the inevitable fluctuations of a random process.' The chapter develops the primitive through multiple worked examples: golf scores day-1 vs day-2 (lucky-on-day-1 → less-lucky-on-day-2); the Sports Illustrated jinx (athletes featured after exceptional seasons regress); ski-jump commentators inventing causal stories for first-jump → second-jump differences; Galton 1886 'Regression towards Mediocrity in Hereditary Stature' (tall-parents → less-tall-children); the highly-intelligent-women-marry-less-intelligent-men example (algebraically equivalent to 'the correlation between spousal IQ is less than perfect' — the surprising form and the trivial form are the same claim); the depressed-children-treated-with-energy-drink-show-improvement example (regression alone produces this; the control-group exists to separate regression from treatment-effect). Kahneman's indispensable methodological diagnostic: 'whenever the correlation between two scores is imperfect, there will be regression to the mean.' The transferable form — and lex-5f2nj carves it — is the bias-as-default-causal-misreading: humans see (extreme → less-extreme) and reach for a treatment-effect story rather than for the regression-to-the-mean null. The chapter's perverse Kahneman corollary (p.176): 'because we tend to be nice to other people when they please us and nasty when they do not, we are statistically punished for being nice and rewarded for being nasty.' The historical-context arc: Galton's 1886 paper 'Regression towards Mediocrity in Hereditary Stature' is the first naming and Kahneman quotes the lecture's surprise; Galton needed years and the help of the era's best statisticians to develop the result. Kahneman closes (echoed by David Freedman): 'if the topic of regression comes up in a criminal or civil trial, the side that must explain regression to the jury will lose the case.'"
    quote: "[Kahneman 2011 Ch.17 opening, the flight-instructors story:] 'When I finished my enthusiastic speech, one of the most seasoned instructors in the group raised his hand and made a short speech of his own. He began by conceding that rewarding improved performance might be good for the birds, but he denied that it was optimal for flight cadets. This is what he said: \"On many occasions I have praised flight cadets for clean execution of some aerobatic maneuver. The next time they try the same maneuver they usually do worse. On the other hand, I have often screamed into a cadet's earphone for bad execution, and in general he does better on his next try. So please don't tell us that reward works and punishment does not, because the opposite is the case.\" This was a joyous moment of insight, when I saw in a new light a principle of statistics that I had been teaching for years. The instructor was right—but he was also completely wrong! His observation was astute and correct: occasions on which he praised a performance were likely to be followed by a disappointing performance, and punishments were typically followed by an improvement. But the inference he had drawn about the efficacy of reward and punishment was completely off the mark. What he had observed is known as regression to the mean, which in that case was due to random fluctuations in the quality of performance... The instructor had attached a causal interpretation to the inevitable fluctuations of a random process.' [The perverse-corollary that names the everyday consequence:] 'I had stumbled onto a significant fact of the human condition: the feedback to which life exposes us is perverse. Because we tend to be nice to other people when they please us and nasty when they do not, we are statistically punished for being nice and rewarded for being nasty.' [Kahneman's crucial methodological claim:] 'whenever the correlation between two scores is imperfect, there will be regression to the mean. To illustrate Galton's insight, take a proposition that most people find quite interesting: \"Highly intelligent women tend to marry men who are less intelligent than they are.\" You can get a good conversation started at a party by asking for an explanation, and your friends will readily oblige. Even people who have had some exposure to statistics will spontaneously interpret the statement in causal terms... Now consider this statement: \"The correlation between the intelligence scores of spouses is less than perfect.\" This statement is obviously true and not interesting at all. Who would expect the correlation to be perfect? There is nothing to explain. But the statement you found interesting and the statement you found trivial are algebraically equivalent.' [The depressed-children-RCT example:] 'Depressed children treated with an energy drink improve significantly over a three-month period... if you treated a group of depressed children for some time with an energy drink, they would show a clinically significant improvement. It is also the case that depressed children who spend some time standing on their head or hug a cat for twenty minutes a day will also show improvement. Most readers of such headlines will automatically infer that the energy drink or the cat hugging caused an improvement, but this conclusion is completely unjustified. Depressed children are an extreme group, they are more depressed than most other children—and extreme groups regress to the mean over time... In order to conclude that an energy drink—or any other treatment—is effective, you must compare a group of patients who receive this treatment to a control group that receives no treatment (or, better, receives a placebo). The control group is expected to improve by regression alone, and the aim of the experiment is to determine whether the treated patients improve more than regression can explain.'"
  - source: practitioner
    text: galton-1886-regression-towards-mediocrity-in-hereditary-stature
    citation: "Francis Galton, 'Regression towards Mediocrity in Hereditary Stature,' *Journal of the Anthropological Institute of Great Britain and Ireland* 15:246-263 (1886). The historical first-naming of the regression-to-the-mean phenomenon. Galton studied the height-distributions of parents and adult children and found that the children of unusually-tall parents were on average less-tall than their parents (and the children of unusually-short parents were on average less-short), with the magnitude of the 'filial regression towards mediocrity' directly proportional to the parental deviation from the population mean. Galton had earlier (1877 Royal Institution lecture) made the same observation in the height-distribution of successive generations of seeds. Galton's struggle to grasp the phenomenon — and his eventual realization that regression and correlation are 'different perspectives on the same concept' — is the historical origin of the modern statistical concept. Pre-acquisition for Galton 1886 itself; cited via Kahneman 2011 Ch.17's extended quotation of Galton's lecture. Kahneman quotes Galton's actual surprise (1877 Royal Institution): 'It appeared from these experiments that the offspring did not tend to resemble their parent seeds in size, but to be always more mediocre than they—to be smaller than the parents, if the parents were large; to be larger than the parents, if the parents were very small. The experiments showed further that the mean filial regression towards mediocrity was directly proportional to the parental deviation from it.'"
    quote: "[Galton 1886/1877 quoted in Kahneman 2011 Ch.17:] 'They yielded results that seemed very noteworthy, and I used them as the basis of a lecture before the Royal Institution on February 9th, 1877. It appeared from these experiments that the offspring did not tend to resemble their parent seeds in size, but to be always more mediocre than they—to be smaller than the parents, if the parents were large; to be larger than the parents, if the parents were very small… The experiments showed further that the mean filial regression towards mediocrity was directly proportional to the parental deviation from it.'"
canonical-instances:
  - "operationally distinct from lex-eb3wf prospective-hindsight-as-failure-mode-elicitation (premortem): lex-eb3wf is prospective and prescriptive (imagine failure in advance to surface risks); lex-5f2nj is a retrospective causal-misreading bias (mistaking regression-to-the-mean for a real effect after the fact)."
  - "operationally distinct from lex-tgqrf outcomes-cluster-heavily-in-a-vital-few-causes (Pareto 80/20): lex-tgqrf describes the SHAPE of a distribution (a few causes account for most of the outcome); lex-5f2nj is a bias in reading CHANGE across two measurements of the same unit — cross-sectional concentration vs. longitudinal misreading of fluctuation as causation."
  - "operationally distinct from lex-zag9z cross-tabulate-hypotheses-against-evidence-and-weight-by-diagnosticity-not-consistency: lex-zag9z is the forecasting discipline that corrects the regression-error via evidence-weighting; lex-5f2nj names the underlying bias the discipline corrects against. lex-zag9z is the antidote, lex-5f2nj is the disease."
  - "operationally distinct from lex-ythes aggregating-multiple-independent-judgments-beats-single-judgment-when-errors-are-uncorrelated: lex-ythes is the aggregation-improves-accuracy primitive; lex-5f2nj is a cognitive bias about mean-reversion. Adjacent through the broader statistical-vs-causal-thinking cluster but distinct mechanisms."
  - "operationally distinct from lex-kyc5a the-margin-of-safety-renders-an-accurate-forecast-unnecessary (Graham 1949): lex-kyc5a is the robust-decision-under-uncertainty primitive; lex-5f2nj is a specific cognitive bias against statistical thinking. lex-5f2nj names a failure mode in causal-greedy forecasting; lex-kyc5a prescribes margin-against-forecast-error as a partial remedy."
  - "Israeli Air Force flight instructors (Kahneman 2011 pp.175-176, the chapter's opening): instructors observed that praising cadets after good performance led to worse next-attempt and yelling after bad performance led to improvement, and inferred that 'punishment works and praise doesn't.' Kahneman: 'the instructor had attached a causal interpretation to the inevitable fluctuations of a random process.' Kahneman demonstrated the regression-to-mean by having each instructor throw two coins at a target without looking — those best on first attempt mostly did worse on second; those worst mostly improved. The lesson: regression makes praise-when-good / punish-when-bad feedback regimes APPEAR to demonstrate that praise-doesn't-work and punishment-does, when in fact the instructor cannot tell from this evidence whether either has any effect at all without a control comparison."
  - "Sports Illustrated jinx (Kahneman 2011 p.177): the folk-belief that athletes featured on the Sports Illustrated cover are 'doomed to perform poorly the following season.' Common causal stories: overconfidence, pressure of expectations. Kahneman's regression account: 'an athlete who gets to be on the cover of Sports Illustrated must have performed exceptionally well in the preceding season, probably with the assistance of a nudge from luck—and luck is fickle.' The simpler account is structural, not psychological. The folk-belief is a regression-effect mistaken for a causal jinx."
  - "Ski-jump commentator inventing causal stories (Kahneman 2011 p.177): during the Olympics ski jump, the commentator said things like 'Norway had a great first jump; he will be tense, hoping to protect his lead and will probably do worse' or 'Sweden had a bad first jump and now he knows he has nothing to lose and will be relaxed, which should help him do better.' Kahneman: 'The commentator had obviously detected regression to the mean and had invented a causal story for which there was no evidence.' The story might be true — perhaps athletes ARE more tense after a great jump — but the regression-to-mean is sufficient to predict the pattern without any psychological mechanism, and the commentator has no way to distinguish."
  - "Galton 1886 'Regression towards Mediocrity in Hereditary Stature': the historical first naming. Tall parents produce children who are on average less tall than they; the magnitude of the filial regression is proportional to the parental deviation from the population mean. Galton's 1877 Royal Institution lecture was on the same finding in successive generations of seeds. The discovery startled the era's best statisticians and required years to develop. The primitive substrate-shape: whenever correlation is imperfect, there will be regression. Kahneman quotes Galton's surprise as canonical illustration of how non-intuitive the phenomenon is."
  - "'Highly intelligent women tend to marry men less intelligent than they are' (Kahneman 2011 p.178): the proposition produces vivid causal speculation at parties (intelligent women avoid competition, intelligent men avoid competitive partners, compromised choices, etc.). But the statement is algebraically equivalent to 'the correlation between spousal IQ is less than perfect,' which is obviously true and trivially uninteresting. Both statements are the same claim. The vividness gap is exactly the System-1 causal-greedy bias lex-5f2nj names: the brain finds the regression-form interesting because it reaches for a causal story; the brain finds the imperfect-correlation form trivial because there is no causal hook."
  - "Depressed children RCT requires control group (Kahneman 2011 p.180): 'Depressed children treated with an energy drink improve significantly over a three-month period.' True. ALSO true: 'depressed children who spend some time standing on their head or hug a cat for twenty minutes a day will also show improvement.' The depressed-children are an EXTREME group; extreme groups regress to the mean over time. To conclude that the energy drink (or any treatment) is causally effective, you MUST compare to a control group that receives no treatment (or placebo). 'The control group is expected to improve by regression alone, and the aim of the experiment is to determine whether the treated patients improve more than regression can explain.' This is the operational transferable form: in any pre-post intervention study on an extreme group, the regression-to-mean baseline must be subtracted before a treatment effect can be claimed."
  - "Reverse-time-arrow check (Kahneman 2011 p.176): if you arrange golfers by day-2 performance and look BACKWARD at day-1, you find the same regression pattern. 'The fact that you observe regression when you predict an early event from a later event should help convince you that regression does not have a causal explanation.' Operational diagnostic: try the reverse-time-arrow framing. If the regression appears symmetric in time, it cannot be caused by anything that happened between the measurements; it's a structural feature of imperfect correlation."
  - "Business commentator's causal-story job security (Kahneman 2011 pp.179-180): 'a business commentator who correctly announces that \"the business did better this year because it had done poorly last year\" is likely to have a short tenure on the air.' The cultural demand for vivid causal stories rewards System-1 causal-greedy explanations of regression and punishes structurally-correct null explanations. The transferable form: in any role where you are paid to interpret events, the audience's causal-greedy preference will pressure you toward regression-as-cause stories. Resist."
  - "David Freedman's jury observation (Kahneman 2011 p.179): 'if the topic of regression comes up in a criminal or civil trial, the side that must explain regression to the jury will lose the case.' The operational transferable claim: regression-to-the-mean is so counter-intuitive to System-1 that even with careful expert testimony, the side trying to explain a non-causal regression to a jury faces a structural disadvantage against an opposing side telling a vivid causal story. The bias-against-statistical-thinking is robust to even significant institutional efforts to correct it."
  - "operationally distinct from lex-7tvr6 outside-view (Tetlock-Gardner 2015): lex-7tvr6 is the forecasting-discipline primitive (anchor on base rates before inside-view adjustments). lex-5f2nj is the specific causal-misreading-of-mean-reversion cognitive bias that lex-7tvr6's outside-view discipline partially corrects against. They compose tightly — invoking outside-view discipline on a problem with extreme-first-observation is one operational antidote to lex-5f2nj's failure mode."
  - "operationally distinct from lex-4697f incompetence-in-a-domain-blocks-the-metacognitive-ability-to-recognize-the-incompetence (Dunning-Kruger): lex-4697f is the unskilled-and-unaware self-assessment bias; lex-5f2nj is the regression-causal-misreading bias. Both are System-1 metacognitive blind spots in the Kahneman tradition but at different cuts. (Note: lex-4697f's agent-instruction flags that the original Kruger-Dunning 1999 finding has statistical-artifact critiques — a kind of regression-related caveat. lex-5f2nj's primitive is broader and not contested.)"
critical-questions:
  - "is the first measurement EXTREME (much above or much below the population mean)? If yes, regression-to-mean is the default null and any 'treatment effect' between measurements must be measured against the regression baseline. If no, regression is not the explanation and you can take the change at face value. Diagnostic question: 'how far from the population mean was the first measurement?' The further out, the larger the expected regression."
  - "is there a CONTROL group (or a population baseline) against which to measure the regression baseline? Without a control, regression and treatment-effect are confounded. The pre-post comparison on an extreme group always shows movement toward the mean regardless of treatment. Practitioner-discipline: refuse pre-post-on-extreme-group comparisons as evidence of treatment effect. Demand a control comparison or refuse to draw a causal conclusion."
  - "is the correlation between the two measurements LESS than 1.0? Kahneman's cardinal methodological claim: 'whenever the correlation between two scores is imperfect, there will be regression to the mean.' In practice correlation is always less than 1.0 — so the question becomes about MAGNITUDE: how imperfect is the correlation, and therefore how much regression should you expect? Strong correlations (height parent-child ~0.50) produce moderate regression; weak correlations (sports performance day-1 day-2 ~0.30 in some events) produce dramatic regression. The size of the regression scales with the correlation gap from 1.0."
  - "are you reaching for a causal story to explain a regression pattern? The default System-1 failure mode. When you see extreme-followed-by-less-extreme, the brain automatically searches associative memory for causal explanations. Practitioner-discipline: pause; ask 'is this just regression?'; check the time-symmetry diagnostic; check whether reverse-time-arrow framing produces the same pattern. If yes to any, treat the regression as the explanation and stop reaching for a causal story unless you have control-group evidence."
  - "is the feedback regime praise-when-good / punish-when-bad? Kahneman's perverse-corollary applies: such regimes APPEAR to demonstrate that punishment-works-and-praise-doesn't, but the appearance is regression-to-mean. Operational consequence: do not infer the effectiveness of feedback from observed pre-post change after extreme performance. Use control-group comparisons (cadets randomly assigned to praise vs. punishment vs. nothing) before drawing conclusions about feedback effectiveness."
  - "is the 'effect' being claimed of a magnitude that exceeds the regression baseline? An RCT with a control group is the gold standard, but in observational contexts you can sometimes estimate the regression baseline (from population statistics, from a comparable non-extreme group, from longitudinal data on the same population). The treatment-effect claim is justified only when the observed change exceeds the regression baseline by a margin that accounts for measurement noise. Otherwise the apparent treatment-effect is illusory."
  - "is the audience or institution rewarding causal stories over structural ones? Kahneman's 'business commentator' observation: cultural demand for vivid causal stories punishes structurally-correct regression explanations. In contexts where you must communicate about regression to a non-statistical audience (juries, executives, the public, journalism), expect structural pushback against the regression explanation. Strategy: lead with the diagnostic (extreme first measurement) and the time-symmetry check; only then introduce the regression-to-mean concept; expect to lose audience attention. Or as Freedman observed, expect to lose the case."
status: active
