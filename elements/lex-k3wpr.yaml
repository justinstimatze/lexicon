    quote: '"Tis too late for men to act, too hard and difficult: I cannot deliver you, and you must decide for yourself."... "Fear not, O king, fear not, lord of chariots; I will set thee free, like the moon when it is caught by Rahu."'
canonical-instances:
  - "A crisis-management consultant, already holding a viable turnaround plan for a failing company on day one, deliberately spends the first week letting the panicked founders sit with the full weight of the numbers and their own past overspending before presenting the plan — betting the founders will actually follow it once relief arrives, rather than treat an immediate fix as one more option to second-guess."
  - "A surgeon who already knows an operation is survivable lets a terrified patient's family sit through a full, honest account of the risks before revealing the favorable odds, so the eventual reassurance is trusted rather than dismissed as reflexive bedside comfort."
critical-questions:
  - "This tactic trades the other person's suffering for a stronger eventual bond — how much unnecessary distress is acceptable to inflict for that payoff, and who gets to decide the tradeoff is worth it on someone else's behalf?"
  - "The king here was fully dependent on Mahosadha with no other options — does withholding a ready rescue still build trust, or does it just look like cruelty, when the person in crisis has any alternative source of help available?"
