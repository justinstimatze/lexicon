id: lex-c3vxa
name: sheer-repetition-wins-compliance-with-no-relationship-required
type-in: process
type-out: claim
_tier: atomic
agent-instruction: "Compliance can be extracted from an authority through pure attrition, with no relationship, sympathy, or shared standard between the parties at all — a judge who explicitly fears no god and regards no man still grants a widow's request, purely because her continual coming wears him down. This is a purer case than persuasion that works through a relationship or shared interest: there's no lever here except the cost of continuing to refuse, applied by someone with zero standing to call in a favor."
related: []
evokes: [kjv, the-unjust-judge, the-importunate-widow, avenge-me-of-mine-adversary, lest-by-her-continual-coming-she-weary-me, because-of-his-importunity]
lineage:
  - source: primary
    text: kjv-1611-luke-18-the-unjust-judge
    citation: "The Holy Bible, King James Version (1611; this edition Project Gutenberg #10), Luke 18:2-5. Verified verbatim against a direct extraction of the held copy."
    quote: "There was in a city a judge, which feared not God, neither regarded man: And there was a widow in that city; and she came unto him, saying, Avenge me of mine adversary. And he would not for a while: but afterward he said within himself, Though I fear not God, nor regard man; Yet because this widow troubleth me, I will avenge her, lest by her continual coming she weary me."
canonical-instances:
  - "A regulator with no personal stake in a case and no relationship to a complainant finally acts on a filing purely because the same complainant has resubmitted it, with identical content, every week for a year — the resolution has nothing to do with the merits landing differently the fiftieth time, only with the cost of continuing to file it away unread."
  - "A vendor who ignored three polite emails about a broken feature finally fixes it after the fourth follow-up, not because the fourth email made a better case than the first -- the case was identical each time -- but because the sheer repetition made continuing to ignore it more costly than fixing it."
  - "The same mechanism works even where a relationship nominally exists and isn't the actual lever: a man refuses to get up and help a friend at midnight, citing the inconvenience, but rises anyway 'because of his importunity' -- Jesus's own text is explicit that it is not the friendship doing the work: 'though he will not rise and give him, because he is his friend, yet because of his importunity he will rise and give him as many as he needeth' (Luke 11:8, KJV 1611, Project Gutenberg #10). The judge case is the purer extreme (zero relationship); this is the same lever operating underneath a relationship that turns out not to be doing the actual work."
critical-questions:
  - "Does winning compliance this way actually resolve the underlying grievance, or does it just make the immediate pressure stop while leaving the judge's actual indifference to the matter completely unchanged?"
  - "When a relationship is present but the text is explicit that the relationship isn't the operative lever (the midnight-friend case), how would the party being pressured, or an outside observer, actually verify that -- versus a case where the relationship really is doing some of the work and repetition is just adding to it?"
status: active
