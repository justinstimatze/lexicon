canonical-instances:
  - "A country bans all commercial use of a native crocodile species to stop poaching, but rural landholders who used to profit from egg-collection quotas have no reason to keep wetland habitat instead of draining it for grazing land -- the ban removed their only economic reason to tolerate a predator on their property. A neighboring country instead licenses regulated egg harvest and ranching, and landholders there report predators on their land to the ranching program rather than shooting them on sight, because a live, breeding crocodile is now worth more to them than a dead one."
  - "A city bans any commercial use of a historic warehouse district to protect the architecture, and owners let the buildings sit vacant and deteriorate because a protected-but-unusable building earns nothing toward its own upkeep. A different city instead permits adaptive reuse -- restaurants, apartments, offices -- inside heritage-listed shells, and the buildings that generate rent are the ones that get maintained, because now someone's income depends on the roof not leaking."
  - "A fishery closes a coral reef to all use to let fish stocks recover, and local fishers who no longer profit from the reef strip its mangrove buffer for firewood and clear it for a resort instead, since the reef no longer pays their bills. A community-managed marine reserve nearby instead grants fishers exclusive licensed access with catch limits, and those fishers actively patrol against outside poachers, because the reef's health is now their own income."
critical-questions:
  - "Doesn't legalizing harvest just create a market for poachers to hide behind, making enforcement harder? That's a real risk when the legal harvest right isn't tied to the actual landholder or community whose habitat decisions matter -- a national quota traded on an open market can launder poached animals. The mechanism here specifically requires the stake to sit with whoever controls the land or water the species depends on; a licensing scheme that separates the earning right from the habitat decision doesn't produce the incentive at all, it just adds a legal cover story to the same extraction pressure."
  - "Isn't this an argument for exploiting every species commercially, since apparently that's what saves them? No: the mechanism only holds where the species' survival is actually contingent on some human actor's ongoing land-use choice. A species whose habitat nobody is deciding whether to convert to something else, deep ocean fish stocks with no competing land use, for instance, doesn't gain protection from being made harvestable; the mechanism specifically answers the case where a ban and an alternative land use are competing for the same acreage."
