id: lex-37m5b
name: arrows-conditions-are-individually-mild-jointly-impossible
type-in: situation
type-out: claim
_tier: molecule
agent-instruction: "When a design brief for a rule or procedure lists several conditions that each sound mild and reasonable on their own, don't assume they're jointly satisfiable just because none of them individually looks demanding -- check each condition's own failure mode before trusting the set. Arrow's General Possibility Theorem names four conditions for turning individual preferences into a social ranking: the rule must work no matter what preferences people actually hold (unrestricted domain), it must respect unanimous agreement (weak Pareto), the ranking of two options can't swing because of how a third, unrelated option is ranked (independence of irrelevant alternatives), and no single person's preference can automatically override everyone else's (non-dictatorship). Each condition has its own documented weak point: the Pareto criterion can certify an arrangement as optimal even when it's morally monstrous, since it's silent on distribution; independence of irrelevant alternatives can be violated by ordinary point-based scoring rules, where an already-losing option's position still flips the ranking of the top two; and attempting to relax any single condition to escape the theorem doesn't produce a working rule, it just relocates the impossibility somewhere else in the system. None of that changes the theorem's core result: all four conditions, mild as each looks, cannot be jointly satisfied by any rule, existing or yet to be invented. Diagnostic move: when a set of individually-reasonable requirements is proposed for a system, check whether the requirements have been proven jointly satisfiable before treating full compliance as a matter of sufficient effort -- and if one is later relaxed to escape a contradiction, check where the underlying tension actually went rather than assuming it dissolved."
decomposes-into: [lex-jjbt3, lex-8ygcs, "[MISSING: arrows-unrestricted-domain-condition]", lex-dyxk3, "[MISSING: arrows-non-dictatorship-condition]", lex-pnnv6]
premises:
  - "Arrow's General Possibility Theorem names four conditions for any rule that aggregates individual preferences into a social ranking: unrestricted domain, weak Pareto, independence of irrelevant alternatives, and non-dictatorship (lex-jjbt3)."
  - "The weak Pareto condition, on its own, is compatible with grossly unjust outcomes -- it certifies an arrangement as optimal whenever no reallocation could help someone without hurting someone else, which says nothing about how good or bad the starting distribution was (lex-8ygcs)."
  - "The independence of irrelevant alternatives condition is violated by common point-based scoring rules -- moving an already-losing third option can flip which of the top two options wins, even though every voter's own ranking of those two never changed (lex-dyxk3)."
  - "Arrow proved these four conditions, despite each sounding individually mild, cannot be jointly satisfied by any social welfare function -- the impossibility is a proven structural fact about the conditions taken together, not a gap that a cleverer rule could eventually close (lex-jjbt3)."
  - "Attempting to escape the impossibility by weakening one condition -- for instance, requiring only an acyclic ranking rather than a fully transitive one -- makes the four conditions jointly satisfiable again. That narrow dependence on the exact assumptions is itself the point: the underlying tension hasn't dissolved, it has just been defined out of scope (lex-pnnv6)."
  - "Therefore Arrow's theorem is not a single flaw locatable in one condition -- it's a structural incompatibility among all four taken together, where each condition individually resists easy dismissal (lex-8ygcs, lex-dyxk3) and relaxing any one merely relocates the difficulty rather than resolving it (lex-pnnv6)."
related: [lex-8ygcs, lex-9a377, lex-dyxk3, lex-jjbt3, lex-pnnv6, lex-psgkw, lex-wmcny, lex-wz94a]
